<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Firebase 快取使用範例</title>
</head>
<body>
  <h1>Firebase Firestore 快取測試</h1>
  <button id="btn-set">寫入快取</button>
  <button id="btn-get">讀取快取</button>
  <button id="btn-del">刪除快取</button>
  <pre id="output">（按按鈕看結果）</pre>

  <!-- 關鍵：type="module" 才能用 import -->
  <script type="module">
    import { cacheGet, cacheSet, cacheDelete, cacheDeleteAll, cacheGetOrFetch } from './firebase-cache.js';

    const out = document.getElementById('output');
    const log = (label, data) => {
      out.textContent = `[${label}] ${new Date().toLocaleTimeString()}\n` +
                        JSON.stringify(data, null, 2);
    };

    // 新 API：cache(topic, subkey, ...) — subkey 可省略走 _default
    document.getElementById('btn-set').onclick = async () => {
      const payload = { hello: 'world', time: Date.now() };
      await cacheSet('demo', null, payload, 60);   // 路徑：cache/demo/_default
      log('SET cache/demo/_default', payload);
    };

    document.getElementById('btn-get').onclick = async () => {
      const data = await cacheGet('demo', null);
      log('GET cache/demo/_default', data);
    };

    document.getElementById('btn-del').onclick = async () => {
      await cacheDeleteAll('demo');   // 清整個 topic（所有 subkey）
      log('DELETE cache/demo/*', 'done');
    };
  </script>
</body>
</html>
