<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小組點名系統 - 主首頁</title>
    <link rel="stylesheet" href="style.css?v=20260831_v3_fast">
    <link rel="manifest" href="../../manifest.json">
</head>
<body class="page-home">
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-msg" id="overlay-text">載入中...</div>
    </div>
    
    <div class="page-shell shell-wide" style="width: 100%; max-width: 100%; margin: 0 auto; padding: 0 20px; box-sizing: border-box;">
        <div class="header">
            <div style="width: 100%; display: flex; justify-content: flex-start; align-items: center; margin-bottom: 15px;">
                <h1 style="margin: 0;">⛪ 小組點名系統</h1>
            </div>
            <div style="width: 100%; display: flex; justify-content: flex-end; align-items: stretch; gap: 12px;">
                <!-- 往左展開的子按鈕容器 -->
                <div id="setupSubButtons" style="display: flex; gap: 8px; opacity: 0; max-width: 0; overflow: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); align-items: center; margin-right: 0;">
                    <button class="stats-link tab-btn" onclick="toggleAccordion('district')">🏰 建立牧區</button>
                    <button class="stats-link tab-btn" onclick="toggleAccordion('cluster')">👥 建立小組群</button>
                </div>
                <button class="stats-link tab-btn" onclick="toggleSetupCollapse()">🏗️ 群組建立</button>
                <button class="stats-link tab-btn" onclick="openWeeklyReport()">📅 本週人數</button>
                <button class="stats-link tab-btn" onclick="window.location.href='manage.html'">⚙️ 後台管理</button>
                <button class="stats-link tab-btn" onclick="window.location.href='stats.html'">📊 統計中心</button>
            </div>
        </div>
    </div>

    <div id="setupCollapseArea" class="page-shell shell-wide" style="display: none; width: 100%; max-width: 100%; margin: 15px auto 0 auto; padding: 15px 20px; box-sizing: border-box; background: #ffffff; border: 1px solid rgba(15, 23, 42, 0.1); border-radius: 12px; text-align: left; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);">
        <h3 style="margin-top: 0; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 18px;">
            <span>🏗️ 系統群組與分類建立</span>
            <button onclick="toggleSetupCollapse(false)" style="background: none; border: none; font-size: 16px; cursor: pointer; color: #999;">收合 ✕</button>
        </h3>
        
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <!-- 1. 新增牧區 (管理員專屬) -->
            <div id="panel-setup-district" class="setup-accordion-item" style="display: none; border: 1px solid #e0e0e0; border-radius: 8px; background: white; overflow: hidden;">
                <div style="width: 100%; text-align: left; padding: 12px 15px; background: #efebe9; font-size: 15px; font-weight: bold; color: #4e342e; border-bottom: 1px solid #e0e0e0;">
                    <span>🏰 新增牧區 (僅限最高權限)</span>
                </div>
                <div id="form-setup-district" class="accordion-content" style="padding: 15px;">
                    <div style="margin-bottom: 12px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px;">牧區名稱：</label>
                        <input type="text" id="newDistrictName" placeholder="請輸入牧區名稱，例如：社青牧區" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px;">拉入哪些小組群 (可多選)：</label>
                        <div id="setupDistrictClustersList" style="max-height: 150px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px; background: #fafafa;">
                            <!-- 動態載入小組群 checkbox -->
                        </div>
                    </div>
                    <button onclick="submitDistrictSetup()" class="submit-btn" style="background-color: #8d6e63; margin-top: 5px;">確認建立牧區</button>
                </div>
            </div>

            <!-- 2. 新增小組群 (管理員/小組長) -->
            <div id="panel-setup-cluster" class="setup-accordion-item" style="display: none; border: 1px solid #e0e0e0; border-radius: 8px; background: white; overflow: hidden;">
                <div style="width: 100%; text-align: left; padding: 12px 15px; background: #efebe9; font-size: 15px; font-weight: bold; color: #4e342e; border-bottom: 1px solid #e0e0e0;">
                    <span>👥 新增小組群</span>
                </div>
                <div id="form-setup-cluster" class="accordion-content" style="padding: 15px;">
                    <div style="margin-bottom: 12px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px;">小組群名稱：</label>
                        <input type="text" id="newClusterNameInput" placeholder="請輸入小組群名稱，例如：迦南群" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
                    </div>
                    <div style="margin-bottom: 12px;" class="admin-only-block">
                        <label style="display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px;">歸屬哪一個牧區 (非最高權限建立時自動留空)：</label>
                        <select id="newClusterDistrict" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background: white;">
                            <option value="">-- 請選擇牧區 (選填) --</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 12px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px;">拉入哪些小組 (可多選，只能選取目前無小組群歸屬的小組)：</label>
                        <div id="setupClusterGroupsList" style="max-height: 150px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px; background: #fafafa;">
                            <!-- 動態載入無歸屬小組 checkbox -->
                        </div>
                    </div>
                    <button onclick="submitClusterSetup()" class="submit-btn" style="background-color: #8d6e63; margin-top: 5px;">確認建立小組群</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="page-shell shell-wide shell-home-content" style="width: 100%; max-width: 100%; margin: 0 auto; padding: 0 20px; box-sizing: border-box;">
        <!-- Tab 頁籤切換 -->
        <div class="tabs-container" style="display: flex; gap: 10px; margin-top: 20px; border-bottom: 2px solid #ddd; padding-bottom: 8px;">
            <button id="tab-regular" class="tab-select-btn active" onclick="switchTab('regular')" style="padding: 10px 20px; border: none; background: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px 8px 0 0;">⛪ 一般常設小組</button>
            <button id="tab-happy" class="tab-select-btn" onclick="switchTab('happy')" style="padding: 10px 20px; border: none; background: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px 8px 0 0;">🍀 幸福小組專區</button>
        </div>

        <!-- 一般常設小組區塊 -->
        <div id="regular-groups-section" class="tab-content-section">
            <div id="regular-group-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px;"></div>
        </div>

        <!-- 幸福小組區塊 -->
        <div id="happy-groups-section" class="tab-content-section" style="display: none;">
            <div style="margin-top: 15px; display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="stats-link tab-btn" onclick="openArchiveHistory()" style="background-color:#E91E63; border:none; cursor:pointer; padding:8px 16px; border-radius:8px; font-size:14px; color:#fff; font-weight:bold; width: auto; height: auto; display: inline-flex; align-items: center; justify-content: center;">📂 讀取歷史紀錄</button>
            </div>
            <div id="happy-group-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px;"></div>
        </div>
    </div>
    
    <div id="createModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleModal(false)">&times;</span>
            <h3 id="createModalTitle">✨ 創建新小組</h3>
            
            <div id="groupTypeSelectionRow" style="margin-bottom: 15px; text-align: left; display: none;">
                <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 6px; color: #333;">小組類型：</label>
                <div style="display: flex; gap: 20px;">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 14px;">
                        <input type="radio" name="newGroupType" value="一般小組" checked> 一般常設小組
                    </label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 14px;">
                        <input type="radio" name="newGroupType" value="幸福小組"> 幸福小組
                    </label>
                </div>
            </div>

            <!-- 繼承名單選項 (僅在選擇幸福小組時顯示) -->
            <div id="inheritSection" style="display: none; margin-bottom: 15px; text-align: left; background: #f5f5f5; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0;">
                <label style="font-weight: bold; font-size: 13px; display: block; margin-bottom: 6px; color: #333;">同工名單來源：</label>
                <select id="inheritSourceGroup" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background: white;">
                    <option value="">-- 自訂新增同工 (不繼承) --</option>
                </select>
            </div>

            <input type="text" id="newGroupName" placeholder="請輸入小組名稱" style="width: 100%; margin-bottom: 12px;">
            <input type="password" id="newGroupCode" placeholder="請設定小組編號 (密碼)" style="width: 100%; margin-bottom: 12px;">
            <button class="submit-btn" onclick="createNewGroup()">確認建立</button>
        </div>
    </div>

    <!-- 歷史封存紀錄彈窗 -->
    <div id="archiveModal" class="modal">
        <div class="modal-content" style="max-width: 700px; width: 90%; max-height: 85vh; overflow-y: auto;">
            <span class="close-btn" onclick="toggleArchiveModal(false)">&times;</span>
            <h3 style="display: flex; align-items: center; gap: 8px; margin-bottom: 20px;">📂 幸福小組歷史紀錄</h3>
            <div id="archiveSelectorSection" style="margin-bottom: 20px; text-align: left;">
                <label style="font-weight: bold; display: block; margin-bottom: 8px; color: #333; font-size: 14px;">請選擇歷史幸福小組檔案：</label>
                <select id="archiveFileSelect" onchange="loadSelectedArchiveContent()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white;">
                    <option value="">-- 請選擇 --</option>
                </select>
            </div>
            <div id="archiveDetailContent" style="display: none; border-top: 1px solid #eee; padding-top: 20px; text-align: left;">
                <h4 id="archiveGroupNameTitle" style="margin: 0 0 8px 0; font-size: 18px; color: #333;"></h4>
                <p id="archiveDateRange" style="font-size: 13px; color: #666; margin: 0 0 20px 0; font-weight: bold; background: #e0f2f1; color: #00796b; display: inline-block; padding: 4px 10px; border-radius: 4px;"></p>
                
                <h5 style="margin: 0 0 10px 0; color: #2196F3; font-size: 15px; border-left: 4px solid #2196F3; padding-left: 8px;">🍀 小組同工與 BEST 成員名單</h5>
                <div id="archiveRosterDiv" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; background: #fafafa; padding: 12px; border-radius: 8px; border: 1px solid #eee;"></div>

                <h5 style="margin: 0 0 10px 0; color: #4CAF50; font-size: 15px; border-left: 4px solid #4CAF50; padding-left: 8px;">📅 歷史點名明細矩陣</h5>
                <div id="archiveTableDiv" style="overflow-x: auto; background: white; border: 1px solid #eee; border-radius: 8px;">
                    <!-- 點名矩陣表格會生成在這裡 -->
                </div>
            </div>
            <div id="archiveLoading" style="text-align: center; color: #999; padding: 30px; display: none;">
                <div class="spinner" style="margin: 0 auto 10px; width: 35px; height: 35px; border-width: 4px;"></div>
                載入中，請稍候...
            </div>
        </div>
    </div>

    <!-- 驗證身分彈窗 -->
    <div id="verifyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleVerifyModal(false)">&times;</span>
            <h3 id="verifyModalTitle">🛡️ 驗證身分</h3>
            <input type="password" id="verifyGroupCode" placeholder="請輸入小組編號 (密碼)">
            <div id="verifyError" style="color: #c62828; font-size: 13px; font-weight: bold; margin-bottom: 12px; display: none;">❌ 編號錯誤！請重新輸入。</div>
            <button class="submit-btn" id="verifySubmitBtn" onclick="submitVerifyCode()">進入小組</button>
        </div>
    </div>

    <!-- 🏗️ 群組建立驗證 Modal -->
    <div id="setupAuthModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleSetupAuthModal(false)">&times;</span>
            <h3>🛡️ 驗證群組建立權限</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 12px;">請輸入最高權限密碼或小組代碼進行驗證</p>
            <input type="password" id="setupAuthCode" placeholder="請輸入代碼" style="width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
            <div id="setupAuthError" style="color: #c62828; font-size: 13px; font-weight: bold; margin-bottom: 12px; display: none;">❌ 代碼錯誤，請重新輸入。</div>
            <button class="submit-btn" id="setupAuthSubmitBtn" onclick="submitSetupAuthCode()">驗證身分</button>
        </div>
    </div>

    <!-- 本週聚會人數彈窗 -->
    <div id="weeklyModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1000; align-items:center; justify-content:center;" onclick="if(event.target===this) closeWeeklyReport()">
        <div style="background:#fff; border-radius:12px; width:90%; max-width:520px; padding:1.5rem; max-height:80vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom:1px solid #eee; padding-bottom:0.75rem;">
                <h2 style="margin:0; font-size:16px;">📅 本週聚會人數</h2>
                <button onclick="closeWeeklyReport()" style="background:none; border:none; font-size:20px; cursor:pointer; color:#999;">✕</button>
            </div>
            <div id="weeklyReportContent">
                <p style="color:#999; text-align:center; padding:2rem 0;">載入中...</p>
            </div>
        </div>
    </div>
    
    <script>window._GAS_KEY = 'LKC_Group_TEST';</script>
    <script src="../../config.js"></script>
    <!-- ⚡ Supabase 本地熱響應服務 (<50ms) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase/supabase-config.js"></script>
    <script src="group-supabase.js?v=20260831_v3_fast"></script>
    <script src="index.js?v=20260831_v3_fast"></script>
    <script>
      // 自動在彈出視窗顯示時鎖定底層 body 捲動
      (function() {
        function syncModalScrollLock() {
          var overlays = document.querySelectorAll('.modal, #weeklyModal');
          var anyVisible = false;
          for (var i = 0; i < overlays.length; i++) {
            var el = overlays[i];
            if (el.classList.contains('show') || (el.style && el.style.display !== 'none' && el.style.display !== '')) {
              anyVisible = true;
              break;
            }
          }
          document.body.classList.toggle('modal-open', anyVisible);
        }
        document.addEventListener('show.bs.modal', function() { document.body.classList.add('modal-open'); });
        document.addEventListener('hidden.bs.modal', function() { syncModalScrollLock(); });
        window.syncModalScrollLock = syncModalScrollLock;
      })();
    </script>
</body>
</html>
