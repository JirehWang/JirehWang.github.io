<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>敬拜曲目管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260606_green">
  <style>
    /* 頁面專屬樣式 */
    .songs-header {
      background: transparent !important;
      padding: 0px 0px 15px 0px !important;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(0, 96, 48, 0.08);
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }
    .songs-header h2 { 
      margin: 0; 
      font-size: 1.6rem; 
      font-weight: 700;
      color: #006030 !important;
    }
    .songs-header .subtitle { 
      font-size: 0.88rem; 
      color: #6c757d; 
      margin-top: 4px; 
    }

    .query-bar {
      background: rgba(255, 255, 255, 0.6) !important;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 96, 48, 0.08) !important;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }

    /* 響應式卡片網格 */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-bottom: 30px;
    }
    @media (min-width: 768px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (min-width: 1200px) {
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* 玻璃擬物卡片 */
    .song-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 96, 48, 0.08) !important;
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 4px 15px rgba(0, 96, 48, 0.02);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .song-card:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 96, 48, 0.18) !important;
      box-shadow: 0 8px 25px rgba(0, 96, 48, 0.06);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-date-info {
      display: flex;
      flex-direction: column;
    }
    .card-date {
      font-size: 1.05rem;
      font-weight: 800;
      color: #006030;
    }
    .card-meeting-name {
      font-size: 0.85rem;
      color: #495057;
      font-weight: 600;
      margin-top: 2px;
    }

    .badge-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .badge-g {
      background-color: #eaf5ee !important;
      color: #006030 !important;
      border: 1px solid rgba(0, 96, 48, 0.12) !important;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-b {
      background-color: #e6f0f7 !important;
      color: #30759f !important;
      border: 1px solid rgba(48, 117, 159, 0.12) !important;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-b.empty {
      background-color: #f8f9fa !important;
      color: #6c757d !important;
      border: 1px solid #dee2e6 !important;
    }

    .card-middle-content {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 96, 48, 0.05);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 12px 0;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .songs-display {
      color: #006030;
      line-height: 1.8;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-all;
      font-weight: 500;
    }
    .songs-display.empty {
      color: #adb5bd;
      font-style: italic;
      font-weight: normal;
    }

    .songs-input {
      width: 100%;
      min-height: 100px;
      border: 1.5px solid rgba(0, 96, 48, 0.15) !important;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      resize: vertical;
      font-family: inherit;
      line-height: 1.6;
      outline: none;
      transition: all 0.25s ease;
      background: #ffffff;
      color: #006030;
    }
    .songs-input:focus { 
      border-color: #30759f !important; 
      box-shadow: 0 0 0 3px rgba(48, 117, 159, 0.15) !important; 
    }

    .card-bottom-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid rgba(0, 96, 48, 0.04);
      padding-top: 10px;
      margin-top: auto;
    }

    .btn-edit-row {
      font-size: 0.78rem;
      padding: 5px 14px;
      border-radius: 6px;
      font-weight: 700;
      border: 1.5px solid #30759f;
      color: #30759f;
      background: transparent;
      transition: all 0.2s;
    }
    .btn-edit-row:hover {
      background: #30759f;
      color: white;
    }
    .btn-save-row {
      font-size: 0.78rem;
      padding: 5px 14px;
      border-radius: 6px;
      font-weight: 700;
      background: linear-gradient(135deg, #006030 0%, #004d26 100%);
      border: none;
      color: white;
      box-shadow: 0 2px 6px rgba(0, 96, 48, 0.15);
      transition: all 0.2s;
    }
    .btn-save-row:hover {
      box-shadow: 0 4px 12px rgba(0, 96, 48, 0.25);
    }
    .btn-cancel-row {
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 600;
      background: #f8f9fa;
      border: 1px solid #ced4da;
      color: #495057;
    }
    .btn-cancel-row:hover {
      background: #e9ecef;
    }

    /* 儲存全部按鈕 */
    #saveAllBtn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      border-radius: 50px;
      padding: 12px 28px;
      font-weight: bold;
      background: linear-gradient(135deg, #006030 0%, #30759f 100%);
      border: none;
      color: white;
      box-shadow: 0 4px 20px rgba(0, 96, 48, 0.25);
      display: none;
      transition: all 0.25s ease;
    }
    #saveAllBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 96, 48, 0.35);
    }

    .table-scroll-wrapper {
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .hint-text {
      font-size: 0.75rem;
      color: #6c757d;
      margin-top: 6px;
    }
  </style>
</head>
<body>
<div class="container py-4">

  <!-- 頁首 -->
  <div class="songs-header">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h2>🎵 敬拜曲目管理</h2>
        <div class="subtitle">每場聚會的敬拜詩歌清單</div>
      </div>
    </div>
  </div>

  <!-- 查詢列 -->
  <div class="query-bar">
    <div class="row g-2 align-items-center">
      <!-- 季度查詢 -->
      <div class="col-12 col-md-auto">
        <div class="input-group input-group-sm">
          <span class="input-group-text fw-bold bg-white text-success">季度</span>
          <select id="quarterSelect" class="form-select" style="min-width:100px;">
            <option value="2026-Q1">2026-Q1</option>
            <option value="2026-Q2" selected>2026-Q2</option>
            <option value="2026-Q3">2026-Q3</option>
            <option value="2026-Q4">2026-Q4</option>
          </select>
          <button class="btn btn-outline-success fw-bold px-3" onclick="loadByQuarter()">讀取</button>
        </div>
      </div>
      <!-- 區間查詢 -->
      <div class="col-12 col-md-auto">
        <div class="input-group input-group-sm">
          <span class="input-group-text fw-bold bg-white text-primary">區間</span>
          <input type="date" id="startDate" class="form-control">
          <span class="input-group-text bg-light">至</span>
          <input type="date" id="endDate" class="form-control">
          <button class="btn btn-outline-primary fw-bold px-3" onclick="loadByDateRange()">讀取</button>
        </div>
      </div>
      <div class="col-12 col-md-auto ms-md-auto">
        <span class="text-muted small">最後同步：<span id="syncTime">--:--</span></span>
      </div>
    </div>
  </div>

  <!-- 卡片容器 -->
  <div class="table-scroll-wrapper" id="tableWrapper" style="display:none;">
    <div class="cards-grid" id="songsCardsContainer"></div>
  </div>

  <!-- 空白提示 -->
  <div id="placeholder" class="text-center text-muted p-5 bg-light rounded-3 border">
    <h5 class="text-secondary fw-bold mb-2">🎵 請選擇季度或日期區間來載入聚會</h5>
    <p class="small mb-0">載入後點擊各卡片的「編輯」按鈕即可填入曲目</p>
  </div>

</div>

<!-- 固定儲存按鈕 -->
<button class="btn btn-success" id="saveAllBtn" onclick="saveAllSongs()">
  💾 儲存所有曲目
</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>window._GAS_KEY = 'LKC_worship'; window._FORCE_PRODUCTION_GAS = true;</script>
<script src="../../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase/supabase-config.js"></script>
<script src="worship-supabase.js"></script>
<script src="worship_songs.js?v=20260830_supabase"></script>
</body>
</html>
