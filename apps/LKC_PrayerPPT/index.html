<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>林口教會 - 禱告會PPT產生器</title>
  <!-- Reuse Worship CSS styles to keep the workspace canvas identical -->
  <link rel="stylesheet" href="../LKC_WorshipPPT/style.css?v=20260715b">
  <link rel="stylesheet" href="../LKC_WorshipPPT/format.css?v=20260716a">
  <link rel="stylesheet" href="../LKC_WorshipPPT/reference-layout.css?v=20260714b">
  <link rel="stylesheet" href="../LKC_WorshipPPT/color-controls.css?v=20260713a">
  <link rel="stylesheet" href="../LKC_WorshipPPT/layout-groups.css?v=20260716a">
  <link rel="stylesheet" href="../LKC_WorshipPPT/pptx-library.css?v=20260714c">
  <link rel="stylesheet" href="../LKC_WorshipPPT/sync-opacity.css?v=20260714b">
  <link rel="stylesheet" href="../LKC_WorshipPPT/theme.css?v=20260716c">
  <link rel="stylesheet" href="../LKC_WorshipPPT/template-switch.css?v=20260719a">
  <style>
    /* Dark theme customizations specifically for the prayer generator workspace */
    body {
      background-color: #121212;
      color: #e0e0e0;
    }
    .topbar {
      background-color: #1a1a1a;
      border-bottom: 1px solid #333;
    }
    .brand span {
      color: #bb86fc !important;
    }
    .flow-panel {
      background-color: #1a1a1a;
      border-right: 1px solid #333;
    }
    .flow-heading {
      border-bottom: 1px solid #333;
    }
    .flow-item {
      background: transparent;
      color: #ccc;
      border-bottom: 1px solid #2a2a2a;
    }
    .flow-item:hover {
      background: #252525;
    }
    .flow-item.active {
      background: #332940 !important;
      color: #bb86fc !important;
      border-left: 4px solid #bb86fc;
    }
    .editor-panel {
      background-color: #1e1e1e;
    }
    .panel-heading {
      border-bottom: 1px solid #333;
    }
    .field input, .field textarea {
      background-color: #2d2d2d;
      color: #fff;
      border: 1px solid #444;
    }
    .field input:focus, .field textarea:focus {
      border-color: #bb86fc;
      outline: none;
    }
    .preview-panel {
      background-color: #1a1a1a;
      border-left: 1px solid #333;
    }
    .preview-heading {
      border-bottom: 1px solid #333;
    }
    .slide-frame {
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .button.quiet {
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
    }
    .button.quiet:hover {
      background: #2d2d2d;
      color: #fff;
    }
    .button.primary {
      background: #6200ee;
      color: #fff;
    }
    .button.primary:hover {
      background: #3700b3;
    }
    /* Customize dialog styling */
    dialog {
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    /* Hide some elements not applicable to the prayer generator */
    .sync-toolbar-option {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="operation-overlay" class="operation-overlay" aria-hidden="true">
    <div class="operation-loader">
      <div class="operation-loader-icon" aria-hidden="true">🛐</div>
      <div class="operation-loader-text">讀取中…</div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand" style="white-space:nowrap" aria-label="林口教會 禱告會PPT產生器">
      林口教會 <span>/ 禱告會PPT產生器</span>
    </div>
    <div class="topbar-actions">
      <label>禱告日期 <input id="service-date" type="date"></label>
      <label class="color-field">投影片底色 <input id="background-color" type="color" value="#111111" aria-label="投影片底色"></label>
      <label class="upload button quiet">上傳背景圖<input id="background-image-upload" type="file" accept="image/png,image/jpeg,image/webp"></label>
      
      <div class="output-scale-toolbar" aria-label="PPT 輸出比例" style="display: flex; gap: 8px;">
        <label>文字 %<input id="lg-output-text-scale" type="number" min="80" max="120" step="1" value="100" style="width: 50px; background:#222; color:#fff; border:1px solid #444;"></label>
        <label>圖片 %<input id="lg-output-image-scale" type="number" min="80" max="120" step="1" value="100" style="width: 50px; background:#222; color:#fff; border:1px solid #444;"></label>
        <button class="button quiet" id="layout-save-output-scale" type="button">儲存比例</button>
      </div>

      <button class="button quiet" id="layout-panel-open">版面參數</button>
      <button class="button quiet layout-lock-button" id="layout-lock-toggle" type="button" aria-pressed="false">版面設定已鎖定</button>
      <button class="button" id="save-draft">儲存草稿</button>
      <button class="button primary" id="export-ppt">匯出 PPTX</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="flow-panel">
      <div class="flow-heading">
        <p id="template-name">禱告會流程</p>
        <strong>製作流程</strong>
        <small>點流程編輯 · 勾選章節調版面</small>
      </div>
      <nav id="flow-list" aria-label="禱告會流程"></nav>
    </aside>

    <section class="editor-panel">
      <div class="panel-heading">
        <p id="section-kind">流程內容</p>
        <h1 id="section-title">請安靜心、等候神</h1>
      </div>
      <form id="editor-form" novalidate></form>
      <p class="save-state" id="save-state" role="status" aria-live="polite" aria-atomic="true" data-state="idle">尚未儲存</p>
    </section>

    <aside class="preview-panel">
      <div class="preview-heading">
        <div>
          <p>整份 PPT 預覽</p>
          <strong id="preview-name">請安靜心、等候神</strong>
        </div>
        <div class="page-nav">
          <button id="page-prev">上一頁</button>
          <span id="slide-count">1 / 1</span>
          <button id="page-next">下一頁</button>
        </div>
      </div>
      
      <div class="slide-frame">
        <div class="slide-background"></div>
        <div class="slide-content" id="slide-content"></div>
      </div>
      
      <div class="preview-note">背景可使用純色或自行上傳圖片。文字大小已固定設定為「標題 60」、「內文 48」。</div>
    </aside>
  </main>

  <aside id="layout-floating-panel" class="layout-floating-panel is-hidden" aria-label="版面參數設定"></aside>

  <dialog id="layout-unlock-dialog" class="layout-unlock-dialog" aria-labelledby="layout-unlock-title">
    <form id="layout-unlock-form">
      <h2 id="layout-unlock-title">解鎖全教會版面配置</h2>
      <p>解鎖後才能修改及儲存全教會共用的版面參數。</p>
      <label>解鎖密碼<input id="layout-unlock-password" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <p id="layout-unlock-error" class="layout-unlock-error" role="alert"></p>
      <footer>
        <button type="button" class="button quiet" id="layout-unlock-cancel">取消</button>
        <button type="submit" class="button primary">解鎖</button>
      </footer>
    </form>
  </dialog>

  <!-- Load API Keys and Core Scripts -->
  <script>window._GAS_KEY = 'LKC_MasterSchedule'; window._FORCE_PRODUCTION_GAS = true;</script>
  <script src="../../config.js"></script>
  <script src="../../firebase/firebase-config-values.js?v=20260719a"></script>
  <script src="../LKC_WorshipPPT/firebase-content-store.js?v=20260719b"></script>
  <script src="../LKC_WorshipPPT/read-api.js?v=20260715a"></script>
  <script src="../LKC_WorshipPPT/vendor-jszip.min.js?v=3.10.1"></script>
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
  
  <!-- Load Bible Parser & Query Service -->
  <script src="../LKC_ppt_generator/bible-service.js"></script>
  
  <!-- Load Custom Prayer Generator Modules -->
  <script src="template-profiles.js?v=20260720a"></script>
  <script src="slide-production.js?v=20260720a"></script>
  <script src="app.js?v=20260720a"></script>
  <script src="ppt-format-preview.js?v=20260720a"></script>
  
  <!-- Load Shared Canvas Drag/Drop and Cloud Sync Scripts -->
  <script src="../LKC_WorshipPPT/layout-cloud-store.js?v=20260720b"></script>
  <script src="../LKC_WorshipPPT/layout-groups.js?v=20260720b"></script>
  
  <!-- Load Custom Exporter -->
  <script src="ppt-export.js?v=20260720a"></script>
</body>
</html>
