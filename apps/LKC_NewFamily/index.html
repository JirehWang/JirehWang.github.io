<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新家人管理系統</title>
  <link rel="stylesheet" href="style.css?v=20260622">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <h1>新家人管理系統</h1>
        <p>填寫後列入追蹤中，結案後移到已結案。</p>
      </div>
      <nav class="tabs" aria-label="功能切換">
        <button class="tab active" type="button" data-tab="form">表單填寫</button>
        <button class="tab" type="button" data-tab="tracking">追蹤中</button>
        <button class="tab" type="button" data-tab="closed">已結案</button>
        <button class="tab" type="button" data-tab="analysis">落戶分析</button>
      </nav>
    </header>

    <section id="formPanel" class="panel">
      <form id="newFamilyForm">
        <div class="form-grid">
          <div class="field">
            <label for="name">新家人姓名</label>
            <input id="name" name="新家人姓名" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="meeting">參加的聚會是</label>
            <select id="meeting" name="參加的聚會是" required>
              <option value="">載入聚會清單中...</option>
            </select>
          </div>

          <div class="field">
            <label for="gender">新家人性別</label>
            <select id="gender" name="新家人性別">
              <option value="">請選擇</option>
              <option>男</option>
              <option>女</option>
            </select>
          </div>

          <div class="field">
            <label for="job">新家人工作</label>
            <input id="job" name="新家人工作" autocomplete="organization-title">
          </div>

          <div class="field">
            <label for="age">年齡 -</label>
            <input id="age" name="年齡 -" inputmode="numeric">
          </div>

          <div class="field">
            <label for="worshipBefore">有參加過基督教的崇拜嗎 ?</label>
            <select id="worshipBefore" name="有參加過基督教的崇拜嗎 ?">
              <option value="">請選擇</option>
              <option>有</option>
              <option>沒有</option>
              <option>不確定</option>
            </select>
          </div>

          <div class="field full">
            <label for="reason">今天為什麼來到林口教會的呢 ?</label>
            <textarea id="reason" name="今天為什麼來到林口教會的呢 ?&#10;(朋友介紹請於其他填入朋友的姓名)" placeholder="例如：朋友介紹、路過、網路搜尋、活動邀請等"></textarea>
          </div>

          <div class="field">
            <label for="careWorker">關懷同工</label>
            <input id="careWorker" name="關懷同工">
          </div>

          <div class="field">
            <label for="inviter">邀約人</label>
            <input id="inviter" name="邀約人">
          </div>

          <div class="field full">
            <label for="address">地址</label>
            <input id="address" name="地址" autocomplete="street-address">
          </div>

          <div class="field">
            <label for="tel">市話</label>
            <input id="tel" name="市話" inputmode="tel" autocomplete="tel">
          </div>

          <div class="field">
            <label for="mobile">手機</label>
            <input id="mobile" name="手機" inputmode="tel" autocomplete="tel">
          </div>

          <div class="field">
            <label for="date">日期</label>
            <input id="date" name="日期" type="date">
          </div>

          <div class="field visit-field">
            <label class="checkbox-label" for="peaceVisit">
              <input id="peaceVisit" name="落戶狀態" type="checkbox" value="請安拜訪">
              <span>請安拜訪</span>
            </label>
          </div>

          <div class="field full">
            <label for="note">備註</label>
            <textarea id="note" name="備註" placeholder="補充關懷資訊或交接備註"></textarea>
          </div>
        </div>

        <div class="actions">
          <button class="btn secondary" type="reset">清除</button>
          <button id="submitBtn" class="btn primary" type="submit">送出表單</button>
        </div>
        <div id="formNotice" class="notice" role="status"></div>
      </form>
    </section>

    <section id="trackingPanel" class="panel" hidden>
      <div class="table-toolbar">
        <div>
          <strong>追蹤中個案</strong>
          <span id="caseCount" class="notice"></span>
        </div>
        <div class="actions compact">
          <button id="trackingSearchBtn" class="btn primary" type="button">查詢</button>
          <button id="addMembersBtn" class="btn secondary" type="button">加入會友名單</button>
          <button id="closeBtn" class="btn danger" type="button">確認結案</button>
        </div>
      </div>
      <div class="filter-grid">
        <div class="field">
          <label for="trackingName">姓名搜尋</label>
          <input id="trackingName" placeholder="輸入姓名關鍵字">
        </div>
        <div class="field">
          <label for="trackingStartDate">起始日期</label>
          <input id="trackingStartDate" type="date">
        </div>
        <div class="field">
          <label for="trackingEndDate">結束日期</label>
          <input id="trackingEndDate" type="date">
        </div>
      </div>
      <div id="trackingContent" class="empty">載入中...</div>
      <div id="trackingNotice" class="notice" role="status"></div>
    </section>

    <section id="closedPanel" class="panel" hidden>
      <div class="table-toolbar">
        <div>
          <strong>已結案個案</strong>
          <span id="closedCount" class="notice"></span>
        </div>
        <div class="actions compact">
          <button id="closedSearchBtn" class="btn primary" type="button">查詢</button>
          <button id="closedExportBtn" class="btn secondary" type="button">匯出 Excel</button>
        </div>
      </div>

      <div class="filter-grid">
        <div class="field">
          <label for="closedName">姓名搜尋</label>
          <input id="closedName" placeholder="輸入姓名關鍵字">
        </div>
        <div class="field">
          <label for="closedStartDate">起始日期</label>
          <input id="closedStartDate" type="date">
        </div>
        <div class="field">
          <label for="closedEndDate">結束日期</label>
          <input id="closedEndDate" type="date">
        </div>
      </div>

      <div id="closedContent" class="empty">請設定條件後查詢，或直接查詢全部已結案資料。</div>
      <div id="closedNotice" class="notice" role="status"></div>
    </section>

    <section id="analysisPanel" class="panel" hidden>
      <div class="table-toolbar">
        <div>
          <strong>新朋友落戶分析</strong>
          <span id="analysisCount" class="notice"></span>
        </div>
        <div class="actions compact">
          <button id="analysisExportDetailBtn" class="btn secondary" type="button">匯出明細 XLSX</button>
          <button id="analysisOpenBtn" class="btn primary" type="button">查看落戶分析</button>
        </div>
      </div>

      <div class="analysis-controls">
        <div class="field year-field">
          <label for="analysisYear">年度</label>
          <input id="analysisYear" type="number" min="2000" max="2100" step="1">
        </div>
        <div class="quick-ranges" aria-label="快捷日期範圍">
          <button class="btn secondary" type="button" data-analysis-range="year">全年</button>
          <button class="btn secondary" type="button" data-analysis-range="h1">上半年</button>
          <button class="btn secondary" type="button" data-analysis-range="h2">下半年</button>
          <button class="btn secondary" type="button" data-analysis-range="q1">Q1</button>
          <button class="btn secondary" type="button" data-analysis-range="q2">Q2</button>
          <button class="btn secondary" type="button" data-analysis-range="q3">Q3</button>
          <button class="btn secondary" type="button" data-analysis-range="q4">Q4</button>
        </div>
      </div>

      <div class="filter-grid">
        <div class="field">
          <label for="analysisStartDate">起始日期</label>
          <input id="analysisStartDate" type="date">
        </div>
        <div class="field">
          <label for="analysisEndDate">結束日期</label>
          <input id="analysisEndDate" type="date">
        </div>
        <div class="field">
          <label for="analysisStatusFilter">落戶狀態</label>
          <select id="analysisStatusFilter">
            <option value="">全部</option>
          </select>
        </div>
      </div>

      <div id="analysisPreview" class="empty">請選擇日期範圍後查看分析。</div>
      <div id="analysisNotice" class="notice" role="status"></div>
    </section>
  </main>

  <div id="editModal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-header">
        <div>
          <h2 id="editTitle">編輯追蹤中資料</h2>
          <p id="editSubtitle"></p>
        </div>
        <button id="editCloseBtn" class="icon-btn" type="button" aria-label="關閉編輯視窗">&times;</button>
      </div>
      <form id="editCaseForm">
        <div id="editFields" class="form-grid"></div>
        <div class="actions">
          <button id="editCancelBtn" class="btn secondary" type="button">取消</button>
          <button id="editSaveBtn" class="btn primary" type="submit">儲存修改</button>
        </div>
        <div id="editNotice" class="notice" role="status"></div>
      </form>
    </section>
  </div>

  <div id="analysisModal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="analysisTitle">
      <div class="modal-header">
        <div>
          <h2 id="analysisTitle">新朋友落戶分析</h2>
          <p id="analysisSubtitle"></p>
        </div>
        <button id="analysisCloseBtn" class="icon-btn" type="button" aria-label="關閉分析視窗">&times;</button>
      </div>
      <div id="analysisModalContent"></div>
      <div class="actions">
        <button id="analysisExportSummaryBtn" class="btn secondary" type="button">匯出統計 XLSX</button>
        <button id="analysisDoneBtn" class="btn primary" type="button">完成</button>
      </div>
    </section>
  </div>

  <div id="sessionModal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="sessionTitle" style="max-width: 440px;">
      <div class="modal-header">
        <div>
          <h2 id="sessionTitle">選擇點名場次</h2>
          <p>請選擇此批新家人要加入的點名場次</p>
        </div>
        <button id="sessionCloseBtn" class="icon-btn" type="button" aria-label="關閉視窗">&times;</button>
      </div>
      <div class="form-grid" style="grid-template-columns: 1fr;">
        <div class="field">
          <label for="sessionSelect">點名場次</label>
          <select id="sessionSelect">
            <!-- 動態載入聚會清單 -->
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="sessionCancelBtn" class="btn secondary" type="button">取消</button>
        <button id="sessionConfirmBtn" class="btn primary" type="button">確認送出</button>
      </div>
    </section>
  </div>

  <!-- Excel-like header filter popover -->
  <div id="headerFilterPopover" class="filter-popover" hidden>
    <div class="popover-search">
      <input type="text" id="popoverSearchInput" placeholder="搜尋包含文字...">
    </div>
    <div class="popover-options-wrap">
      <label class="popover-option select-all-label">
        <input type="checkbox" id="popoverSelectAll" checked>
        <span>(全選)</span>
      </label>
      <div id="popoverOptionsList" class="popover-options-list"></div>
    </div>
    <div class="popover-actions">
      <button type="button" id="popoverCancelBtn" class="btn secondary">取消</button>
      <button type="button" id="popoverConfirmBtn" class="btn primary">確定</button>
    </div>
  </div>

  <script>window._GAS_KEY = 'LKC_NewFamily';</script>
  <script src="../../config.js?v=20260622"></script>
  <script src="api-config.js?v=20260622"></script>
  <script src="script.js?v=20260622"></script>
</body>
</html>
