<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教會行事曆 - 月曆視圖（新版）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/zh-tw.global.min.js"></script>
  <style>
    body { background: #f5f7fb; }
    #calendar { background:#fff; border-radius:12px; padding:1rem; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
    .fc-event { cursor:pointer; border:none !important; padding:2px 4px; font-size:.78rem; }
    .fc-event:hover { opacity:.85; }
    .fc-day-today { background-color: #fff5cc !important; }
    .filter-chip { cursor:pointer; user-select:none; transition: all .15s; }
    .filter-chip:hover { transform: scale(1.05); }
    .filter-chip.off { opacity: .3; filter: grayscale(80%); }
    .field-input { font-size: .9rem; }
    .event-meta { font-size: .8rem; color:#6c757d; }
    .field-row-display { padding:.4rem .6rem; background:#f8f9fa; border-radius:6px; margin-bottom:.4rem; }
    .field-row-display .label { font-weight:600; color:#495057; min-width:80px; display:inline-block; }
  </style>
</head>
<body>
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="fw-bold mb-1">📅 教會行事曆（新版）</h3>
      <div class="text-muted small">月曆視圖 + 彩色分類 + 動態欄位</div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <a href="index.html" class="btn btn-outline-secondary btn-sm">← 舊版（聚會/講道）</a>
      <a href="types.html" class="btn btn-outline-primary btn-sm">⚙️ 事項類型管理</a>
      <button class="btn btn-success btn-sm" onclick="openAddEventModal()">➕ 新增事項</button>
    </div>
  </div>

  <!-- 類型篩選 chips -->
  <div class="card mb-3 border-0 shadow-sm">
    <div class="card-body py-2 px-3">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span class="text-muted small fw-bold me-2">📂 顯示類型：</span>
        <div id="typeChipsContainer" class="d-flex flex-wrap gap-2 flex-grow-1">
          <span class="text-muted small">載入中...</span>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="toggleAllChips(true)">全選</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="toggleAllChips(false)">全不選</button>
      </div>
    </div>
  </div>

  <div id="calendar"></div>
</div>

<!-- 新增/編輯事項 Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header" style="background:#f5f7fb;">
        <h5 class="modal-title fw-bold" id="eventModalTitle">新增事項</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="evf_eventId">

        <div class="row g-3 mb-3">
          <div class="col-md-7">
            <label class="form-label fw-bold">📂 事項類型 *</label>
            <select id="evf_typeId" class="form-select" onchange="onTypeChanged()">
              <option value="">-- 選擇類型 --</option>
            </select>
          </div>
          <div class="col-md-5">
            <label class="form-label fw-bold">📅 日期 *</label>
            <input type="date" id="evf_date" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">🏷️ 顯示標題（選填）</label>
          <input type="text" id="evf_title" class="form-control" placeholder="留空時自動從第一個欄位取">
        </div>

        <hr>
        <div id="evf_fieldsContainer">
          <div class="text-muted text-center py-4">請先選擇事項類型，下方會顯示對應欄位</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-outline-danger me-auto" id="evf_deleteBtn" style="display:none;" onclick="deleteEvent()">🗑️ 刪除</button>
        <button type="button" class="btn btn-primary" onclick="saveEvent()">💾 儲存</button>
      </div>
    </div>
  </div>
</div>

<!-- 事項詳情 Modal（點事件時開啟，可進入編輯） -->
<div class="modal fade" id="eventDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header" id="eventDetailHeader" style="background:#f5f7fb;">
        <h5 class="modal-title fw-bold" id="eventDetailTitle">事項詳情</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="eventDetailBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">關閉</button>
        <button type="button" class="btn btn-outline-danger" id="evd_deleteBtn" onclick="confirmDeleteFromDetail()">🗑️ 刪除</button>
        <button type="button" class="btn btn-primary" id="evd_editBtn" onclick="editFromDetail()">✏️ 編輯</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>window._GAS_KEY = 'LKC_MasterSchedule';</script>
<script src="https://jirehwang.github.io/LKC1958_June_1.github.io/config.js"></script>
<script src="calendar.js"></script>
</body>
</html>
