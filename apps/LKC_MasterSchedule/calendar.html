<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教會行事曆 - 月曆視圖（新版）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/zh-tw.global.min.js"></script>
  <style>
    body { background: #f5f7fb; }
    #calendar { background:#fff; border-radius:12px; padding:1rem; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
    .fc-event { cursor:pointer; border:none !important; padding:2px 4px; font-size:.78rem; }
    .fc-event:hover { opacity:.85; }
    .fc-day-today { background-color: #fff5cc !important; }
    .filter-chip { cursor:pointer; user-select:none; transition: all .15s; }
    .filter-chip:hover { transform: scale(1.05); }
    .filter-chip.off { opacity: .3; filter: grayscale(80%); }
    .field-input { font-size: .9rem; }
    .event-meta { font-size: .8rem; color:#6c757d; }
    .field-row-display { padding:.4rem .6rem; background:#f8f9fa; border-radius:6px; margin-bottom:.4rem; }
    .field-row-display .label { font-weight:600; color:#495057; min-width:80px; display:inline-block; }
  </style>
</head>
<body>
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="fw-bold mb-1">📅 教會行事曆（新版）</h3>
      <div class="text-muted small">月曆視圖 + 彩色分類 + 動態欄位</div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <a href="index.html" class="btn btn-outline-secondary btn-sm">← 舊版（聚會/講道）</a>
      <a href="https://www.notion.so/0e80c109c4a348db9c210708af186028?v=5bcf181fde614a34a88d7e480397357a&source=copy_link" class="btn btn-outline-primary btn-sm">⚙️ 事項類型管理</a>
      <button class="btn btn-success btn-sm" onclick="openAddEventModal()">➕ 新增事項</button>
      <button class="btn btn-info btn-sm" onclick="openBatchModal()">📅 批量新增</button>
      <button class="btn btn-warning btn-sm" onclick="openAiModal()">🤖 AI 解析</button>
      <button class="btn btn-dark btn-sm" onclick="document.getElementById('excelUploadInput').click()">📤 上傳 Excel</button>
      <input type="file" id="excelUploadInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="handleExcelUpload(event)">
    </div>
  </div>

  <!-- 類型篩選 chips -->
  <div class="card mb-3 border-0 shadow-sm">
    <div class="card-body py-2 px-3">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span class="text-muted small fw-bold me-2">📂 顯示類型：</span>
        <div id="typeChipsContainer" class="d-flex flex-wrap gap-2 flex-grow-1">
          <span class="text-muted small">載入中...</span>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="toggleAllChips(true)">全選</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="toggleAllChips(false)">全不選</button>
      </div>
    </div>
  </div>

  <div id="calendar"></div>
</div>

<!-- 新增/編輯事項 Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header" style="background:#f5f7fb;">
        <h5 class="modal-title fw-bold" id="eventModalTitle">新增事項</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="evf_eventId">

        <div class="row g-3 mb-3">
          <div class="col-md-7">
            <label class="form-label fw-bold">📂 事項類型 *</label>
            <select id="evf_typeId" class="form-select" onchange="onTypeChanged()">
              <option value="">-- 選擇類型 --</option>
            </select>
          </div>
          <div class="col-md-5">
            <label class="form-label fw-bold">📅 日期 *</label>
            <input type="date" id="evf_date" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">🏷️ 行程標題（選填）</label>
          <input type="text" id="evf_title" class="form-control" placeholder="月曆上顯示的文字；留空 = 自動取第一個欄位的值">
        </div>

        <hr>
        <div id="evf_fieldsContainer">
          <div class="text-muted text-center py-4">請先選擇事項類型，下方會顯示對應欄位</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-outline-danger me-auto" id="evf_deleteBtn" style="display:none;" onclick="deleteEvent()">🗑️ 刪除</button>
        <button type="button" class="btn btn-primary" onclick="saveEvent()">💾 儲存</button>
      </div>
    </div>
  </div>
</div>

<!-- 事項詳情 Modal（點事件時開啟，可進入編輯） -->
<div class="modal fade" id="eventDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header" id="eventDetailHeader" style="background:#f5f7fb;">
        <h5 class="modal-title fw-bold" id="eventDetailTitle">事項詳情</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="eventDetailBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">關閉</button>
        <button type="button" class="btn btn-outline-danger" id="evd_deleteBtn" onclick="confirmDeleteFromDetail()">🗑️ 刪除</button>
        <button type="button" class="btn btn-primary" id="evd_editBtn" onclick="editFromDetail()">✏️ 編輯</button>
      </div>
    </div>
  </div>
</div>

<!-- 批量新增 Modal -->
<div class="modal fade" id="batchModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header" style="background:#e8f4ff;">
        <h5 class="modal-title fw-bold">📅 批量新增事項</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- 日期區 -->
        <div class="card mb-3 border-info">
          <div class="card-header bg-info text-white py-2"><b>步驟 1 — 選日期</b></div>
          <div class="card-body">
            <div class="row g-2 mb-2">
              <div class="col-md-5">
                <label class="form-label small fw-bold">開始日期</label>
                <input type="date" id="batch_startDate" class="form-control form-control-sm">
              </div>
              <div class="col-md-5">
                <label class="form-label small fw-bold">結束日期</label>
                <input type="date" id="batch_endDate" class="form-control form-control-sm">
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-sm btn-info w-100" onclick="batchGenerateDates()">產生日期</button>
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label small fw-bold">星期幾（可多選；不選 = 全部）</label>
              <div id="batch_weekdays" class="d-flex gap-1 flex-wrap">
                <button type="button" class="btn btn-sm btn-outline-secondary batch-wd" data-wd="0">日</button>
                <button type="button" class="btn btn-sm btn-outline-secondary batch-wd" data-wd="1">一</button>
                <button type="button" class="btn btn-sm btn-outline-secondary batch-wd" data-wd="2">二</button>
                <button type="button" class="btn btn-sm btn-outline-secondary batch-wd" data-wd="3">三</button>
                <button type="button" class="btn btn-sm btn-outline-secondary batch-wd" data-wd="4">四</button>
                <button type="button" class="btn btn-sm btn-outline-secondary batch-wd" data-wd="5">五</button>
                <button type="button" class="btn btn-sm btn-outline-secondary batch-wd" data-wd="6">六</button>
              </div>
            </div>
            <hr>
            <label class="form-label small fw-bold">已選日期（點 ✕ 可移除）</label>
            <div id="batch_dateChips" class="d-flex flex-wrap gap-1 p-2 border rounded bg-light" style="min-height:50px;">
              <span class="text-muted small">尚未產生</span>
            </div>
          </div>
        </div>

        <!-- 類型區 -->
        <div class="card mb-3 border-success">
          <div class="card-header bg-success text-white py-2"><b>步驟 2 — 選類型</b></div>
          <div class="card-body">
            <select id="batch_typeId" class="form-select form-select-sm" onchange="onBatchTypeChanged()">
              <option value="">-- 選擇類型 --</option>
            </select>
          </div>
        </div>

        <!-- 欄位區 -->
        <div class="card mb-3 border-warning">
          <div class="card-header bg-warning py-2"><b>步驟 3 — 填欄位（套用到所有日期）</b></div>
          <div class="card-body">
            <div id="batch_fieldsContainer" class="text-muted text-center py-3">
              請先選擇類型
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">取消</button>
        <span class="text-muted small me-auto" id="batch_summary"></span>
        <button type="button" class="btn btn-primary" onclick="confirmBatchAdd()">💾 批量建立</button>
      </div>
    </div>
  </div>
</div>

<!-- AI 解析 Modal -->
<div class="modal fade" id="aiModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header" style="background:#fff5e6;">
        <h5 class="modal-title fw-bold">🤖 AI 解析貼上文字</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-bold">📂 預期類型 *</label>
          <select id="ai_rootTypeId" class="form-select">
            <option value="">-- 選擇頂層類型 --</option>
          </select>
          <div class="form-text">AI 會依此類型的欄位定義來解析</div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">📝 貼上原始文字</label>
          <textarea id="ai_rawText" class="form-control" rows="8"
            placeholder="把講道排程、課表、會議紀要等貼進來，AI 會嘗試擷取出多筆事項"></textarea>
        </div>
        <button class="btn btn-warning w-100" onclick="runAiParse()">🤖 開始解析</button>

        <hr>
        <div id="ai_resultPreview"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="ai_confirmBtn" style="display:none;" onclick="confirmAiBatchAdd()">💾 批量建立</button>
      </div>
    </div>
  </div>
</div>

<!-- Excel 匯入預覽 Modal -->
<div class="modal fade" id="excelPreviewModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title fw-bold">📤 Excel 匯入預覽</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="excelPreviewBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">取消</button>
        <span class="me-auto text-muted small" id="excelPreviewSummary"></span>
        <button type="button" class="btn btn-primary" id="excelConfirmBtn" onclick="confirmExcelImport()">💾 確認建立</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>window._GAS_KEY = 'LKC_MasterSchedule';</script>
<script src="https://jirehwang.github.io/LKC1958_June_1.github.io/config.js"></script>
<script>
  window.LKC_NOTION_CALENDAR = {
    enabled: true,
    pageId: '0e80c109-c4a3-48db-9c21-0708af186028',
    databaseId: '3871fade-5670-41d2-991f-af1612d48c0b'
  };
</script>
<script src="notion-calendar-adapter.js"></script>
<script src="calendar.js"></script>
</body>
</html>
