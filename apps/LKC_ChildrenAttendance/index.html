<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>⛪ 兒童主日出席點名系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css?v=20260420">
  <link rel="manifest" href="../../manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #fef9c3 0%, #ecfdf5 50%, #dbeafe 100%);
      font-family: 'Quicksand', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      color: #1e293b;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .app-container {
      width: 100%;
      padding: 20px 15px;
      margin-right: auto;
      margin-left: auto;
      transition: max-width 0.3s ease;
    }
    #main-nav {
      max-width: 550px;
      margin: 0 auto;
    }
    .nav-card { 
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      height: 95px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 900; 
      border-radius: 20px !important;
      border: none !important;
      color: white !important;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .nav-card:hover { 
      transform: translateY(-5px) scale(1.02); 
      box-shadow: 0 15px 30px rgba(0,0,0,0.12); 
    }
    .nav-card:active {
      transform: translateY(-1px) scale(0.98);
    }
    .bg-gradient-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .bg-gradient-blue { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
    .bg-gradient-orange { background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%); }
    .bg-gradient-pink { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); }

    .nav-icon { font-size: 2rem; margin-right: 15px; }
    .nav-text { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.5px; }
    .custom-modal-backdrop {
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(15, 23, 42, 0.6); 
      z-index: 9999; 
      overflow-y: auto;
      backdrop-filter: blur(4px);
    }
    body.modal-open {
      overflow: hidden !important;
      height: 100vh !important;
    }
    .custom-modal-content {
      background: white;
      padding: 30px 20px;
      margin: 40px auto;
      width: 95%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.8);
    }
    .fw-black {
      font-weight: 900;
    }

    /* 統一視覺圓角與表單元件規範 (全體套用圓角矩形，摒棄膠囊型/Pill以求一致性) */
    .btn, 
    .badge, 
    .form-control, 
    .form-select, 
    .input-group, 
    .custom-modal-content {
      border-radius: 14px !important;
    }

    /* 修正 input-group 內部的元件邊框與圓角疊合怪異問題 */
    .input-group .form-control, 
    .input-group .form-select, 
    .input-group .input-group-text, 
    .input-group .btn {
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      margin: 0 !important;
    }
    
    .input-group.border {
      border: 1.5px solid #cbd5e1 !important;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .input-group.border:focus-within {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15) !important;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div id="main-nav">
      <div class="d-flex flex-column align-items-center mb-4 text-center mt-3">
        <h1 class="fw-black mb-1" style="background: linear-gradient(135deg, #059669 0%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: -1px; font-size: 2rem;">兒童出席點名系統</h1>
        <p class="text-muted fw-bold small mb-2">Church Children's Attendance Portal</p>
        <a href="https://www.canva.com/design/DAHCGu-ynJs/eI1qlAREHLG-vLxNELzXxg/view?utm_content=DAHCGu-ynJs&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=h30d97a479b" 
           target="_blank" 
           class="btn btn-sm btn-white px-3 shadow-sm border mt-1 bg-white" 
           style="font-size: 0.8rem; font-weight: 700; color: #475569;">
           📖 系統操作說明
        </a>
      </div>
      
      <div class="card nav-card bg-gradient-green shadow mb-3" onclick="loadAttendancePage(null)">
        <div class="d-flex align-items-center"><span class="nav-icon">🎤</span><span class="nav-text">主日點名系統</span></div>
      </div>
      
      <div class="card nav-card bg-gradient-blue shadow mb-3" onclick="loadPage('MEMBERS')">
        <div class="d-flex align-items-center"><span class="nav-icon">👥</span><span class="nav-text">會友名單管理</span></div>
      </div>
      
      <div class="card nav-card bg-gradient-orange shadow mb-3" onclick="loadPage('STATS')">
        <div class="d-flex align-items-center"><span class="nav-icon">📊</span><span class="nav-text">出席統計查詢</span></div>
      </div>
 
      <div class="card nav-card bg-gradient-pink shadow mb-3" onclick="loadPage('TREND_CHART')">
        <div class="d-flex align-items-center"><span class="nav-icon">📈</span><span class="nav-text">趨勢分析圖表</span></div>
      </div>
    </div>
 
    <div id="content-area" style="display:none;">
      <button class="btn btn-outline-secondary mb-4 shadow-sm px-3 fw-bold" onclick="showHome()">← 回主選單</button>
      
      <div id="page-ATTENDANCE" class="page-section"></div>
      <div id="page-MEMBERS" class="page-section"></div>
      <div id="page-STATS" class="page-section"></div>
      <div id="page-TREND_CHART" class="page-section"></div>
    </div>

  </div>

  <!-- 設定檔與 API 橋接層 -->
  <script>window._GAS_KEY = 'LKC_ChildrenAttendance';</script>
  <script src="../../config.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>

<script>
  var autoJumpConfig = { cat: null, grp: null, active: false };
  var pageLoaded = { ATTENDANCE: false, MEMBERS: false, STATS: false, TREND_CHART: false };

  /**
   * 動態載入子頁面 HTML
   * ✅ 已修改：拿掉 pages/ 前綴，直接從根目錄讀取
   */
  async function loadPageContent(pageId, filename) {
    if (pageLoaded[pageId]) return;
    const container = document.getElementById('page-' + pageId);
    container.innerHTML = '<div id="page-loading"><div class="spinner-border text-primary me-3"></div> 載入中...</div>';
    try {
      const res = await fetch(filename + '.html');
      if (!res.ok) throw new Error('找不到 ' + filename + '.html');
      container.innerHTML = await res.text();
      pageLoaded[pageId] = true;

      container.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
        oldScript.remove();
      });
    } catch (e) {
      container.innerHTML = '<div class="alert alert-danger m-3">❌ 頁面載入失敗：' + e.message + '</div>';
    }
  }

  function prepareContentArea() {
    document.getElementById('main-nav').style.display = 'none';
    document.getElementById('content-area').style.display = 'block';
    document.querySelectorAll('.page-section').forEach(sec => sec.style.display = 'none');
  }

  function showHome() {
    if (typeof stopScanning === "function") stopScanning();
    if (typeof stopAutoSync === "function") stopAutoSync();
    document.getElementById('main-nav').style.display = 'block';
    document.getElementById('content-area').style.display = 'none';
    autoJumpConfig.active = false;
  }

  async function loadAttendancePage(type) {
    prepareContentArea();
    document.getElementById('page-ATTENDANCE').style.display = 'block';
    await loadPageContent('ATTENDANCE', 'attendance');
    if (typeof initAttendancePage === "function") initAttendancePage(type);
  }

  async function loadPage(pageId) {
    prepareContentArea();
    const target = document.getElementById('page-' + pageId);
    if (!target) return;
    target.style.display = 'block';

    const fileMap = { MEMBERS: 'members', STATS: 'STATS', TREND_CHART: 'Chart' };
    await loadPageContent(pageId, fileMap[pageId]);

    if (pageId === 'MEMBERS' && typeof refreshMemberTable === "function") refreshMemberTable();
    if (pageId === 'STATS') {
      if (typeof initStatsPage === "function") initStatsPage();
      else if (typeof fetchStatsData === "function") fetchStatsData();
    }
    if (pageId === 'TREND_CHART') {
      const groupNameEl = document.getElementById('chartGroupName');
      if (groupNameEl) groupNameEl.innerText = (typeof currentAttType !== 'undefined' && currentAttType) ? currentAttType : "尚未選擇";
      if (typeof loadChartData === "function") loadChartData();
    }
  }

  window.onload = function() {
    if (typeof initializeApp === "function") initializeApp();

    // ✅ 已修改：直接從瀏覽器網址讀取參數，取代 google.script.url.getLocation
    const params = new URLSearchParams(window.location.search);
    const initCat = params.get('cat');
    const initGrp = params.get('grp');

    if (initCat && initGrp) {
      console.log("🚀 偵測到跳轉指令：", initCat, initGrp);
      autoJumpConfig.cat = initCat;
      autoJumpConfig.grp = initGrp;
      autoJumpConfig.active = true;

      prepareContentArea();
      document.getElementById('page-ATTENDANCE').style.display = 'block';

      // 直接加載點名頁面，後續名單載入與防呆鎖定交給 attendance.js 自行並行處理
      loadPageContent('ATTENDANCE', 'attendance');
    }       // ← 關 if

    // 自動在彈出視窗顯示時鎖定底層 body 捲動
    var scrollLockObserver = new MutationObserver(function(mutations) {
      var anyVisible = false;
      var overlays = document.querySelectorAll('.custom-overlay, .custom-modal-backdrop, .modal');
      overlays.forEach(function(el) {
        if (window.getComputedStyle(el).display !== 'none') {
          anyVisible = true;
        }
      });
      if (anyVisible) {
        document.body.classList.add('modal-open');
      } else {
        document.body.classList.remove('modal-open');
      }
    });
    scrollLockObserver.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['style']
    });
  };        // ← 關 window.onload
</script>
</body>
</html>
