<style>
  .member-table-container {
    height: calc(100vh - 225px); 
    overflow: auto;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: white;
    box-shadow: var(--shadow-soft);
  }
  .member-table-container thead th {
    position: sticky;
    top: 0;
    z-index: 10;
    background-color: var(--text-primary) !important;
    color: white;
    font-weight: 600;
    border-bottom: 0;
    padding: 12px 16px;
  }
  .member-table-container thead th:first-child { position: sticky; left: 0; z-index: 11; }
  .member-table-container tbody td:first-child {
    position: sticky;
    left: 0;
    z-index: 5;
    background-color: #f8fafc; 
    border-right: 1px solid var(--border-color); 
    box-shadow: 2px 0 6px rgba(15, 42, 53, 0.03); 
  }
  .member-table-container tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
  }
  .member-table-container tbody tr:hover td {
    background-color: rgba(6, 182, 212, 0.03) !important;
  }
  .member-table-container tbody tr:hover td:first-child {
    background-color: #f1f5f9 !important;
  }
</style>

<div class="members-main-wrapper p-2">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="input-group shadow-sm border-0" style="width: 280px; border-radius: 20px; overflow: hidden;">
      <span class="input-group-text bg-white border-0 text-muted px-3" style="font-size: 0.9rem;">🔍</span>
      <input type="text" id="memberSearchInput" class="form-control border-0 py-2" placeholder="輸入姓名即時查找..." oninput="filterMembers()" style="font-size: 0.9rem;">
      <button id="memberClearBtn" class="btn bg-white border-0 text-muted pe-3" type="button" onclick="clearMemberSearch()" style="display: none; font-size: 0.9rem;">✕</button>
    </div>
    <button class="btn btn-primary border-0 shadow-sm px-4 py-2 fw-bold" onclick="openMemberModal()" style="border-radius: 20px; font-size: 0.9rem; background-color: var(--color-teal);">＋ 新增會友</button>
  </div>

  <div class="member-table-container shadow-sm">
    <table class="table table-hover align-middle mb-0" style="min-width: 880px;"> 
      <thead class="table-dark">
        <tr>
          <th style="width: 110px;">姓名</th>
          <th style="width: 100px;">會友代碼</th>
          <th style="width: 70px;">性別</th>
          <th style="width: 110px;">建立日期</th>
          <th>備註</th>
          <th style="width: 120px;">狀態</th>
          <th style="width: 120px;">操作</th>
        </tr>
      </thead>
      <tbody id="memberTableBody">
        <tr><td colspan="7" class="text-center p-5">資料載入中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 會友編輯 Modal -->
<div id="memberListModal" class="custom-overlay">
  <div class="custom-modal-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 id="memModalHeader" class="fw-bold mb-0 text-dark">新增會友資料</h5>
      <button type="button" class="btn-close" onclick="closeMemberModal()"></button>
    </div>
    <hr style="opacity: 0.1;">
    <input type="hidden" id="editOldName_Mem">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label fw-bold small text-secondary">系統編號</label>
        <div class="input-group shadow-sm" style="border-radius: 10px; overflow: hidden;">
          <input type="text" id="editModal_Uid" class="form-control border-0 bg-light" readonly placeholder="讀取中/無編號" style="font-size: 0.95rem;">
          <button type="button" class="btn btn-light border-0 fw-bold px-3 text-secondary" id="btnShowQrCode" onclick="openQrModal()" style="font-size: 0.85rem;">📷 顯示 QR / 卡片</button>
        </div>
      </div>
      <div class="col-md-8">
        <label class="form-label fw-bold small text-secondary">姓名</label>
        <input type="text" id="editName_Mem" class="form-control border-0 bg-light py-2.5" placeholder="請輸入姓名" style="border-radius: 10px; font-size: 0.95rem;">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold small text-secondary">性別</label>
        <select id="editGender_Mem" class="form-select border-0 bg-light py-2.5" style="border-radius: 10px; font-size: 0.95rem;">
          <option value="男">男 👦</option>
          <option value="女">女 👧</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label fw-bold small text-secondary">備註</label>
        <textarea id="editNote_Mem" class="form-control border-0 bg-light" rows="3" placeholder="其他聯絡資訊或註記..." style="border-radius: 10px; font-size: 0.95rem;"></textarea>
      </div>
      <div class="col-12">
        <div class="form-check form-switch mt-2">
          <input class="form-check-input" type="checkbox" id="editIsExcluded_Mem">
          <label class="form-check-label fw-bold text-dark" for="editIsExcluded_Mem">不列入主日出席率統計</label>
        </div>
        <small class="text-secondary mt-1 d-block" style="font-size: 0.75rem;">
          ℹ️ 所屬小組與身分請至「<a href="../LKC_Group/" target="_blank" class="text-teal text-decoration-none border-bottom border-teal">小組系統</a>」管理
        </small>
      </div>
    </div>
    <div class="text-end mt-4">
      <button class="btn btn-light px-4 me-2 border-0" onclick="closeMemberModal()" style="border-radius: 20px;">取消</button>
      <button id="saveMemBtn" class="btn btn-primary px-4 fw-bold border-0" onclick="processMemberSave()" style="border-radius: 20px; background-color: var(--color-teal);">確認儲存</button>
    </div>
  </div>
</div>

<!-- QR Code Modal -->
<div id="qrCodeModal" class="custom-overlay">
  <div class="custom-modal-content" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0 text-dark" id="qrModalTitle">專屬 QR Code / 卡片預覽</h5>
      <button type="button" class="btn-close" onclick="closeQrModal()"></button>
    </div>
    <hr style="opacity: 0.1;">
    <div class="text-center mb-3">
      <div class="btn-group shadow-sm" role="group" style="border-radius: 20px; overflow: hidden; border: 1px solid var(--border-color);">
        <input type="radio" class="btn-check" name="previewType" id="typeQr" autocomplete="off" checked onclick="togglePreviewMode('qr')">
        <label class="btn btn-light px-4 border-0 fw-bold" for="typeQr" style="font-size: 0.85rem;">純 QR Code</label>
        <input type="radio" class="btn-check" name="previewType" id="typeCard" autocomplete="off" onclick="togglePreviewMode('card')">
        <label class="btn btn-light px-4 border-0 fw-bold" for="typeCard" style="font-size: 0.85rem;">🖼️ 預覽實體卡片</label>
      </div>
    </div>
    <div class="p-4 bg-light border-0 rounded-4 mb-3 d-flex justify-content-center align-items-center flex-column" style="min-height: 280px; border-radius: var(--radius-md) !important; background-color: #f8fafc !important;">
      <img id="qrModal_Img" src="" alt="預覽圖" style="max-width: 100%; max-height: 280px; display: none; box-shadow: 0 10px 30px rgba(15, 42, 53, 0.08); border-radius: 8px;">
      <span id="qrModal_EmptyText" class="text-secondary">此會友尚無資料</span>
      <div id="previewLoading" style="display: none;" class="text-center">
        <div class="water-ripple mb-2"><div></div><div></div></div>
        <div class="small text-secondary">雲端繪製中，請稍候...</div>
      </div>
    </div>
    <div class="text-end mt-4">
      <button class="btn btn-light px-3 me-2 border-0" onclick="closeQrModal()" style="border-radius: 20px;">返回</button>
      <button id="btnDownloadQr" class="btn btn-success px-3 fw-bold me-2 border-0" onclick="downloadQrCode()" style="border-radius: 20px; background-color: var(--color-green);">📥 下載 QR</button>
      <button id="btnDownloadCard" class="btn btn-warning px-3 fw-bold text-dark me-2 border-0" style="display:none; border-radius: 20px; background-color: var(--color-gold);" onclick="downloadCardJpg()">📥 下載卡片圖檔 (JPG)</button>
      <button id="btnCreateCard" class="btn btn-info px-3 fw-bold text-white border-0" onclick="createCardAction()" style="border-radius: 20px; background-color: var(--color-teal);">📇 儲存卡片至雲端</button>
    </div>
  </div>
</div>

<script>
  var allMembersRawData = [];
  var memberUsageByUid = {};
  var currentQrUrl = "";
  var currentMemberName = "";

  function getMemberScrollKey(rowOrUid) {
    const rawValue = Array.isArray(rowOrUid) ? (rowOrUid[7] || rowOrUid[0]) : rowOrUid;
    return encodeURIComponent(String(rawValue || ''));
  }

  function restoreMemberScroll(anchor) {
    const scrollContainer = document.querySelector('.member-table-container');
    if (!anchor || !scrollContainer || !window.ListScrollAnchor) return;
    const restoreAnchor = function() {
      window.ListScrollAnchor.restore(scrollContainer, 'tr[data-scroll-key]', anchor);
    };
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(restoreAnchor);
    else setTimeout(restoreAnchor, 0);
  }

  function refreshMemberTable(options) {
    options = options || {};
    const scrollContainer = document.querySelector('.member-table-container');
    const preferredKey = options.preserveUid ? getMemberScrollKey(options.preserveUid) : '';
    const scrollAnchor = scrollContainer && window.ListScrollAnchor
      ? window.ListScrollAnchor.capture(scrollContainer, 'tr[data-scroll-key]', preferredKey)
      : null;
    const tbody = document.getElementById('memberTableBody');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center p-5"><div class="spinner-border text-primary"></div><br>資料載入中...</td></tr>';
    google.script.run.withSuccessHandler(function(data) {
      const response = data || {};
      allMembersRawData = Array.isArray(response) ? response : (response.members || []);
      memberUsageByUid = response.usageByUid || {};
      filterMembers();
      restoreMemberScroll(scrollAnchor);
    }).getMemberManagementData();
  }

  function filterMembers() {
    const keyword = document.getElementById('memberSearchInput').value.trim().toLowerCase();
    document.getElementById('memberClearBtn').style.display = keyword ? 'block' : 'none';
    if (!keyword) { renderTable(allMembersRawData); return; }
    const filtered = allMembersRawData.filter(row => {
      const name = (row[0] || "").toString().toLowerCase();
      const code = (row[7] || "").toString().toLowerCase();
      return name.includes(keyword) || code.includes(keyword);
    });
    renderTable(filtered);
  }

  function clearMemberSearch() {
    document.getElementById('memberSearchInput').value = '';
    filterMembers();
  }

  function renderTable(data) {
    const tbody = document.getElementById('memberTableBody');
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center p-5 text-muted">查無資料</td></tr>';
      return;
    }
    let html = '';
    data.forEach(row => {
      if (!row[0]) return;
      const isExcluded = (row[4] === true || row[4] === "TRUE");
      const usage = memberUsageByUid[String(row[7] || '').trim().toUpperCase()] || {};
      const statusHtml = usage.effective
        ? `<div class="d-flex flex-wrap gap-1">
            <span class="badge bg-primary bg-opacity-10 text-primary border-0 px-2 py-1">有效</span>
            ${isExcluded ? '<span class="badge bg-warning bg-opacity-10 border-0 px-2 py-1" style="color: #d97706 !important;">不統計</span>' : ''}
          </div>`
        : (isExcluded
          ? '<span class="badge bg-warning bg-opacity-10 border-0 px-2 py-1" style="color: #d97706 !important;">不統計</span>'
          : '<span class="badge bg-success bg-opacity-10 text-success border-0 px-2 py-1">正常</span>');
      const deleteButtonHtml = usage.effective
        ? '<button class="btn btn-sm btn-outline-secondary border-0 fw-bold" disabled title="已有點名紀錄或小組關聯，僅可改為不統計" style="border-radius: 12px; font-size: 0.8rem;">不可刪除</button>'
        : `<button class="btn btn-sm btn-outline-danger border-0 fw-bold" onclick="deleteMemberAction('${row[0]}')" style="border-radius: 12px; font-size: 0.8rem; color: var(--color-rose); background-color: rgba(244, 63, 94, 0.05);">刪除</button>`;
      let dateStr = row[2] || '';
      const rowJson = JSON.stringify(row).replace(/'/g, "&#39;");
      html += `<tr data-scroll-key="${getMemberScrollKey(row)}">
        <td class="text-dark"><strong>${row[0]}</strong></td>
        <td><code class="text-secondary" style="font-family: var(--font-sans);">${row[7] || ''}</code></td>
        <td>${row[1] === '男' ? '👦 男' : (row[1] === '女' ? '👧 女' : row[1] || '')}</td>
        <td><small class="text-secondary">${dateStr}</small></td>
        <td title="${row[3] || ''}"><div class="text-truncate text-secondary" style="max-width:200px;">${row[3] || ''}</div></td>
        <td>${statusHtml}</td>
        <td>
          <div class="btn-group" style="gap: 4px;">
            <button class="btn btn-sm btn-outline-primary border-0 fw-bold" onclick='openMemberModal(${rowJson})' style="border-radius: 12px; font-size: 0.8rem; color: var(--color-teal); background-color: rgba(6, 182, 212, 0.05);">編輯</button>
            ${deleteButtonHtml}
          </div>
        </td>
      </tr>`;
    });
    tbody.innerHTML = html;
  }

  function calculateNextUid(data) {
    if (!data || data.length === 0) return "M00001";
    let maxNum = 0;
    let prefix = "M";
    data.forEach(row => {
      let uid = String(row[7] || "").trim();
      if (uid) {
        let match = uid.match(/^(.*?)(\d+)$/);
        if (match) {
          let num = parseInt(match[2], 10);
          if (num > maxNum) { maxNum = num; prefix = match[1]; }
        }
      }
    });
    return prefix + (maxNum + 1).toString().padStart(5, '0');
  }

  function openMemberModal(row = null) {
    document.getElementById('memberListModal').style.display = 'block';
    const btnShowQr = document.getElementById('btnShowQrCode');
    if (row) {
      document.getElementById('memModalHeader').innerText = "編輯會友資料";
      document.getElementById('editOldName_Mem').value = row[0];
      document.getElementById('editName_Mem').value = row[0];
      document.getElementById('editGender_Mem').value = row[1];
      document.getElementById('editNote_Mem').value = row[3];
      document.getElementById('editIsExcluded_Mem').checked = (row[4] === true || row[4] === "TRUE");
      let uid = String(row[7] || "").trim();
      document.getElementById('editModal_Uid').value = uid || "無編號";
      currentMemberName = row[0];
      currentQrUrl = uid ? "https://quickchart.io/qr?size=250x250&text=" + encodeURIComponent(uid) : "";
      btnShowQr.disabled = !uid;
    } else {
      document.getElementById('memModalHeader').innerText = "新增會友資料";
      document.getElementById('editOldName_Mem').value = "";
      document.getElementById('editName_Mem').value = "";
      document.getElementById('editGender_Mem').value = "男";
      document.getElementById('editNote_Mem').value = "";
      document.getElementById('editIsExcluded_Mem').checked = false;
      let nextUid = calculateNextUid(allMembersRawData);
      document.getElementById('editModal_Uid').value = nextUid;
      currentMemberName = "新會友";
      currentQrUrl = "https://quickchart.io/qr?size=250x250&text=" + encodeURIComponent(nextUid);
      btnShowQr.disabled = false;
    }
  }

  function closeMemberModal() { document.getElementById('memberListModal').style.display = 'none'; }

  function openQrModal() {
    const nameInput = document.getElementById('editName_Mem').value.trim();
    currentMemberName = nameInput || currentMemberName;
    document.getElementById('qrModalTitle').innerText = currentMemberName + " 的專屬資料";
    document.getElementById('typeQr').checked = true;
    togglePreviewMode('qr');
    document.getElementById('qrCodeModal').style.display = 'block';
  }

  function closeQrModal() { document.getElementById('qrCodeModal').style.display = 'none'; }

  var currentCardBase64 = "";

  function togglePreviewMode(mode) {
    const img = document.getElementById('qrModal_Img');
    const emptyText = document.getElementById('qrModal_EmptyText');
    const loading = document.getElementById('previewLoading');
    const btnDownloadQr = document.getElementById('btnDownloadQr'); 
    const btnDownloadCard = document.getElementById('btnDownloadCard'); 

    img.style.display = 'none';
    emptyText.style.display = 'none';
    loading.style.display = 'none';

    if (mode === 'qr') {
      if (btnDownloadCard) btnDownloadCard.style.display = 'none'; 
      if (currentQrUrl !== "") {
        img.src = currentQrUrl;
        img.style.display = 'block';
        if (btnDownloadQr) btnDownloadQr.style.display = 'inline-block';
      } else {
        emptyText.innerText = "此會友尚無 QR Code";
        emptyText.style.display = 'block';
        if (btnDownloadQr) btnDownloadQr.style.display = 'none';
      }
    } else if (mode === 'card') {
      if (btnDownloadQr) btnDownloadQr.style.display = 'none'; 
      if (btnDownloadCard) btnDownloadCard.style.display = 'none'; 
      const uidInput = document.getElementById('editModal_Uid').value.trim();
      if (!uidInput || uidInput === "無編號") {
        emptyText.innerText = "缺少系統編號，無法預覽";
        emptyText.style.display = 'block';
        return;
      }
      loading.style.display = 'block';
      google.script.run
        .withSuccessHandler(function(res) {
          loading.style.display = 'none';
          if (res.success) {
            currentCardBase64 = res.base64; 
            img.src = res.base64;
            img.style.display = 'block';
            if (btnDownloadCard) btnDownloadCard.style.display = 'inline-block'; 
          } else {
            emptyText.innerText = "❌ 預覽失敗：" + res.msg;
            emptyText.style.display = 'block';
          }
        })
        .withFailureHandler(function(err) {
          loading.style.display = 'none';
          emptyText.innerText = "❌ 伺服器錯誤";
          emptyText.style.display = 'block';
        })
        .previewMemberCard({ name: currentMemberName, uid: uidInput });
    }
  }

  function downloadCardJpg() {
    if (!currentCardBase64) return;
    const a = document.createElement('a');
    a.href = currentCardBase64;
    a.download = currentMemberName + "_專屬名卡.jpg"; 
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function downloadQrCode() {
    if (!currentQrUrl) return;
    const btn = document.getElementById('btnDownloadQr');
    const originalText = btn.innerHTML;
    btn.innerHTML = "📥 抓取中..."; btn.disabled = true;
    fetch(currentQrUrl).then(r => r.blob()).then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = currentMemberName + "_QRCode.png";
      document.body.appendChild(a); a.click();
      window.URL.revokeObjectURL(url); document.body.removeChild(a);
      btn.innerHTML = originalText; btn.disabled = false;
    });
  }

  function processMemberSave() {
    const oldName = document.getElementById('editOldName_Mem').value;
    const name = document.getElementById('editName_Mem').value.trim();
    const gender = document.getElementById('editGender_Mem').value;
    const note = document.getElementById('editNote_Mem').value.trim();
    const isExcluded = document.getElementById('editIsExcluded_Mem').checked;
    const memberUid = document.getElementById('editModal_Uid').value.trim();
    if (!name) return alert("請輸入姓名");
    const btn = document.getElementById('saveMemBtn');
    btn.disabled = true; btn.innerText = "處理中...";

    const onSuccess = function(msg) {
      alert(msg); btn.disabled = false; btn.innerText = "確認儲存";
      if (msg && msg.includes("成功")) {
        closeMemberModal();
        refreshMemberTable({ preserveUid: memberUid });
      }
    };

    // 所屬小組、身分由小組系統管理，此處不傳
    if (!oldName) {
      google.script.run
        .withSuccessHandler(onSuccess)
        .addMember({ name, gender, note, isExcluded });
    } else {
      google.script.run
        .withSuccessHandler(onSuccess)
        .updateMember(oldName, { name, gender, note, isExcluded });
    }
  }

  function deleteMemberAction(name) {
    if (confirm("⚠️ 確定刪除 [" + name + "] ?")) {
      google.script.run.withSuccessHandler(function(msg) { alert(msg); refreshMemberTable(); }).deleteMember(name);
    }
  }

  function createCardAction() {
    const uidInput = document.getElementById('editModal_Uid').value.trim();
    if (!uidInput || uidInput === "無編號") return alert("編號錯誤");
    const btn = document.getElementById('btnCreateCard');
    const originalText = btn.innerHTML;
    btn.innerHTML = "製作中..."; btn.disabled = true;
    google.script.run.withSuccessHandler(function(res) {
      btn.innerHTML = originalText; btn.disabled = false;
      if (res.success && confirm("✅ 成功！是否開啟查看？")) window.open(res.fileUrl, '_blank');
      else if (!res.success) alert("❌ 失敗：" + res.msg);
    }).generateMemberCard({ name: currentMemberName, uid: uidInput });
  }

  // 頁面載入時自動刷新
  refreshMemberTable();
</script>
