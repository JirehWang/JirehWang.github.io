<script>
  var allMembersRawData = [];
  var memberUsageByUid = {};
  var currentQrUrl = "";
  var currentMemberName = "";
  var currentShareUrl = "";
  var currentShareQrUrl = "";

  function getMemberScrollKey(rowOrUid) {
    const rawValue = Array.isArray(rowOrUid) ? (rowOrUid[7] || rowOrUid[0]) : rowOrUid;
    return encodeURIComponent(String(rawValue || ''));
  }

  function restoreMemberScroll(anchor) {
    const scrollContainer = document.querySelector('.member-table-container');
    if (!anchor || !scrollContainer || !window.ListScrollAnchor) return;
    const restoreAnchor = function() {
      window.ListScrollAnchor.restore(scrollContainer, 'tr[data-scroll-key]', anchor);
    };
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(restoreAnchor);
    else setTimeout(restoreAnchor, 0);
  }

  function refreshMemberTable(options) {
    options = options || {};
    const scrollContainer = document.querySelector('.member-table-container');
    const preferredKey = options.preserveUid ? getMemberScrollKey(options.preserveUid) : '';
    const scrollAnchor = scrollContainer && window.ListScrollAnchor
      ? window.ListScrollAnchor.capture(scrollContainer, 'tr[data-scroll-key]', preferredKey)
      : null;
    const tbody = document.getElementById('memberTableBody');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center p-5"><div class="spinner-border text-primary"></div><br>資料載入中...</td></tr>';
    google.script.run.withSuccessHandler(function(data) {
      const response = data || {};
      allMembersRawData = Array.isArray(response) ? response : (response.members || []);
      memberUsageByUid = response.usageByUid || {};
      filterMembers();
      restoreMemberScroll(scrollAnchor);
    }).getMemberManagementData();
  }

  function updateMemberSummary(visibleCount) {
    const summary = document.getElementById('memberListSummary');
    if (!summary) return;
    const total = allMembersRawData.filter(row => row && row[0]).length;
    const keyword = (document.getElementById('memberSearchInput').value || '').trim();
    summary.textContent = keyword ? `顯示 ${visibleCount} / ${total} 位會友` : `共 ${total} 位會友`;
  }

  function filterMembers() {
    const keyword = document.getElementById('memberSearchInput').value.trim().toLowerCase();
    document.getElementById('memberClearBtn').style.display = keyword ? 'block' : 'none';
    if (!keyword) {
      updateMemberSummary(allMembersRawData.filter(row => row && row[0]).length);
      renderTable(allMembersRawData);
      return;
    }
    const filtered = allMembersRawData.filter(row => {
      const name = (row[0] || "").toString().toLowerCase();
      const code = (row[7] || "").toString().toLowerCase();
      return name.includes(keyword) || code.includes(keyword);
    });
    updateMemberSummary(filtered.filter(row => row && row[0]).length);
    renderTable(filtered);
  }

  function clearMemberSearch() {
    document.getElementById('memberSearchInput').value = '';
    filterMembers();
  }

  function renderTable(data) {
    const tbody = document.getElementById('memberTableBody');
    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center p-5 text-muted">查無資料</td></tr>';
      return;
    }
    let html = '';
    data.forEach(row => {
      if (!row[0]) return;
      const isExcluded = (row[4] === true || row[4] === "TRUE");
      const usage = memberUsageByUid[String(row[7] || '').trim().toUpperCase()] || {};
      const statusHtml = usage.effective
        ? `<div class="d-flex flex-wrap gap-1">
            <span class="badge bg-primary bg-opacity-10 text-primary border-0 px-2 py-1">有效</span>
            ${isExcluded ? '<span class="badge bg-warning bg-opacity-10 border-0 px-2 py-1" style="color: #d97706 !important;">不統計</span>' : ''}
          </div>`
        : (isExcluded
          ? '<span class="badge bg-warning bg-opacity-10 border-0 px-2 py-1" style="color: #d97706 !important;">不統計</span>'
          : '<span class="badge bg-success bg-opacity-10 text-success border-0 px-2 py-1">正常</span>');
      const deleteButtonHtml = usage.effective
        ? '<button class="btn btn-sm btn-outline-secondary border-0 fw-bold" disabled title="已有點名紀錄或小組關聯，僅可改為不統計" style="border-radius: 12px; font-size: 0.8rem;">不可刪除</button>'

  function calculateNextUid(data) {
    if (!data || data.length === 0) return "M00001";
    let maxNum = 0;
    let prefix = "M";
    data.forEach(row => {
      let uid = String(row[7] || "").trim();
      if (uid) {
        let match = uid.match(/^(.*?)(\d+)$/);
        if (match) {
          let num = parseInt(match[2], 10);
          if (num > maxNum) { maxNum = num; prefix = match[1]; }
        }
      }
    });
    return prefix + (maxNum + 1).toString().padStart(5, '0');
  }

  function togglePreviewMode(mode) {
    const img = document.getElementById('qrModal_Img');

    const btnDownloadQr = document.getElementById('btnDownloadQr');

      if (currentQrUrl !== "") {
        img.src = currentQrUrl;
        img.style.display = 'block';

        emptyText.innerText = "此會友尚無 QR Code";

        if (btnDownloadQr) btnDownloadQr.style.display = 'none';
      }
    } else if (mode === 'card') {
      if (btnDownloadQr) btnDownloadQr.style.display = 'none'; 
      if (btnDownloadCard) btnDownloadCard.style.display = 'none'; 
      const uidInput = document.getElementById('editModal_Uid').value.trim();

        emptyText.innerText = "缺少系統編號，無法預覽";

          loading.style.display = 'none';
          if (res.success) {
            currentCardBase64 = res.base64; 
            img.src = res.base64;
            img.style.display = 'block';
            if (btnDownloadCard) btnDownloadCard.style.display = 'inline-block'; 
          } else {
            emptyText.innerText = "❌ 預覽失敗：" + res.msg;

          emptyText.style.display = 'block';

            if (shareLinkPanel) shareLinkPanel.style.display = 'block';
            if (btnDownloadShareQr) btnDownloadShareQr.style.display = 'inline-block';
          } else {
            emptyText.innerText = "❌ " + ((res && res.msg) || "建立分享連結失敗");

  function normalizeOfficialMember(member) {
    member = member || {};
    return {
      rowIndex: member.rowIndex || 0,
      name: String(member.name || '').trim(),
      categoryCode: member.categoryCode || member.category_code || '',
      categoryName: member.categoryName || member.category_name || '',
      uid: String(member.uid || '').trim(),
      status: member.status || '',
      votingRights: member.votingRights !== undefined ? member.votingRights : !!member.voting_rights,
      isResident: member.isResident !== undefined ? member.isResident : !!member.is_resident,
      notes: member.notes || ''
    };
  }

  function mergeOfficialMemberSources(serverList) {
    const merged = (Array.isArray(serverList) ? serverList : [])
      .map(normalizeOfficialMember)
      .filter(member => member.name);
    const knownNames = new Set(merged.map(member => member.name));
    (window.INITIAL_OFFICIAL_MEMBERS || []).forEach(function(member) {
      const normalized = normalizeOfficialMember(member);
      if (normalized.name && !knownNames.has(normalized.name)) {
        merged.push(normalized);
        knownNames.add(normalized.name);
      }
    });
    return merged;
  }

    const counts = { ALL: allOfficialMembersData.length };
    allOfficialMembersData.forEach(member => {

      const code = button.dataset.category;
      button.textContent = `${labels[code] || code} (${counts[code] || 0})`;

  function filterOfficialMembers() {
    updateOfficialCategoryCounts();
    const keyword = (document.getElementById('officialSearchInput').value || '').trim().toLowerCase();
    let filtered = allOfficialMembersData;

    if (activeOfficialCat !== 'ALL') {
      filtered = filtered.filter(m => (m.categoryCode || m.category_code) === activeOfficialCat);
    }

    if (keyword) {
      filtered = filtered.filter(m => {
        const name = (m.name || '').toLowerCase();
        const uid = (m.uid || '').toLowerCase();
        const cat = (m.categoryName || m.category_name || '').toLowerCase();
        return name.includes(keyword) || uid.includes(keyword) || cat.includes(keyword);
      });
    }

    renderOfficialTable(filtered);
  }

      residentEl.checked = false;
    }
  }

  
  function addCurrentGeneralToOfficial() {
    const name = document.getElementById('editName_Mem').value.trim();
    if (!name) {
      alert("會友姓名不能為空白");
      return;
    }
    closeMemberModal();
    openEditOfficialModal(0, name);
    document.getElementById('offMemModalHeader').innerText = `📋 將「${name}」加入和會獨立會員名單`;
  }

  function openAddOfficialModal() {
    document.getElementById('offMemModalHeader').innerText = "➕ 新增和會獨立會員";
    document.getElementById('editOffRowIndex').value = "";
    document.getElementById('editOffName').value = "";
    document.getElementById('editOffName').disabled = false;
    document.getElementById('editOffCategory').value = "CAT_1";
    document.getElementById('editOffVotingRights').checked = true;
    document.getElementById('editOffIsResident').checked = true;
    document.getElementById('editOffNotes').value = "";
    document.getElementById('officialMemberModal').style.display = 'block';
  }

  function openEditOfficialModal(rowIndex, name) {
    const item = allOfficialMembersData.find(m => m.name === name || String(m.rowIndex) === String(rowIndex));
    document.getElementById('offMemModalHeader').innerText = `✏️ 編輯會員資料及類別 — ${name}`;
    document.getElementById('editOffRowIndex').value = rowIndex || (item ? item.rowIndex : '');
    document.getElementById('editOffName').value = name;
    document.getElementById('editOffName').disabled = false;
    document.getElementById('editOffCategory').value = item ? (item.categoryCode || item.category_code || 'CAT_1') : 'CAT_1';
    document.getElementById('editOffVotingRights').checked = item ? (item.votingRights !== undefined ? item.votingRights : item.voting_rights) : true;
    document.getElementById('editOffIsResident').checked = item ? (item.isResident !== undefined ? item.isResident : item.is_resident) : true;
    document.getElementById('editOffNotes').value = item ? (item.notes || '') : '';
    document.getElementById('officialMemberModal').style.display = 'block';
  }

  function closeOfficialMemberModal() {
    document.getElementById('officialMemberModal').style.display = 'none';
  }

  function saveOfficialMemberAction() {
    const rowIndex = document.getElementById('editOffRowIndex').value;
    const name = document.getElementById('editOffName').value.trim();
    const categoryCode = document.getElementById('editOffCategory').value;
    const categoryName = catNamesMap[categoryCode] || categoryCode;
    const votingRights = document.getElementById('editOffVotingRights').checked;
    const isResident = document.getElementById('editOffIsResident').checked;
    const notes = document.getElementById('editOffNotes').value.trim();

    if (!name) {
      alert("請輸入會員姓名！");
      return;
    }

    const saveBtn = document.getElementById('saveOffMemBtn');
    saveBtn.disabled = true;
    saveBtn.innerText = "儲存中...";

    const payload = {
      rowIndex: rowIndex ? parseInt(rowIndex, 10) : 0,
      name: name,
      categoryCode: categoryCode,
      categoryName: categoryName,
      votingRights: votingRights,
      isResident: isResident,
      notes: notes
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          saveBtn.disabled = false;
          saveBtn.innerText = "確認儲存";
          closeOfficialMemberModal();
          alert(res.message || "✅ 儲存成功！");
          fetchOfficialMembersData();
        })
        .withFailureHandler(function(err) {
          saveBtn.disabled = false;
          saveBtn.innerText = "確認儲存";
          alert("❌ 儲存失敗：" + err.message);
        })
        .saveOfficialMember(payload);
    } else {
      // 本地展示模組
      const existingIndex = allOfficialMembersData.findIndex(m => m.name === name);
      if (existingIndex >= 0) {
        allOfficialMembersData[existingIndex].categoryCode = categoryCode;
        allOfficialMembersData[existingIndex].categoryName = categoryName;
        allOfficialMembersData[existingIndex].votingRights = votingRights;
        allOfficialMembersData[existingIndex].isResident = isResident;
        allOfficialMembersData[existingIndex].notes = notes;
      } else {
        allOfficialMembersData.push({
          name: name,
          categoryCode: categoryCode,
          categoryName: categoryName,
          uid: "",
          status: "UNMATCHED",
          votingRights: votingRights,
          isResident: isResident,
          notes: notes
        });
      }
      saveBtn.disabled = false;
      saveBtn.innerText = "確認儲存";
      closeOfficialMemberModal();
      alert("✅ [模擬] 會員資料與類別更新成功！");
      filterOfficialMembers();
    }
  }

  refreshMemberTable();
</script>
