<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林口教會管理系統</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #2c5f9e 0%, #4a90e2 60%, #6bb3f0 100%);
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(44, 95, 158, 0.3);
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .container {
            flex: 1;
            padding: 36px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            border-radius: 16px;
            padding: 28px 20px 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            text-decoration: none;
            color: #2d3748;
            border-top: 4px solid transparent;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.13);
        }

        .card:nth-child(1) { border-top-color: #4a90e2; }
        .card:nth-child(2) { border-top-color: #e06c8a; }
        .card:nth-child(3) { border-top-color: #f5a623; }
        .card:nth-child(4) { border-top-color: #7ed321; }
        .card:nth-child(5) { border-top-color: #9b59b6; }
        .card:nth-child(6) { border-top-color: #1abc9c; }
        .card:nth-child(7) { border-top-color: #e67e22; }
        .card:nth-child(8) { border-top-color: #3498db; }
        .card:nth-child(9) { border-top-color: #808080; }
        .card:nth-child(10) { border-top-color: #16a085; }

        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            font-size: 28px;
        }

        .card:nth-child(1) .icon-wrap { background: #eaf2fd; }
        .card:nth-child(2) .icon-wrap { background: #fdeef3; }
        .card:nth-child(3) .icon-wrap { background: #fef7eb; }
        .card:nth-child(4) .icon-wrap { background: #f2fae8; }
        .card:nth-child(5) .icon-wrap { background: #f5eefa; }
        .card:nth-child(6) .icon-wrap { background: #e8f8f5; }
        .card:nth-child(7) .icon-wrap { background: #fdf3e7; }
        .card:nth-child(8) .icon-wrap { background: #eaf5fd; }
        .card:nth-child(9) .icon-wrap { background: #F5F5F5; }
        .card:nth-child(10) .icon-wrap { background: #e8f8f5; }

        .title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            line-height: 1.5;
            color: #2d3748;
        }

        footer {
            text-align: center;
            padding: 18px;
            font-size: 12px;
            color: #a0aec0;
            border-top: 1px solid #e2e8f0;
            background: white;
        }
    </style>
</head>

<body>

</header>

</html>
