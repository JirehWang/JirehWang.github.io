<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教會服事管理系統 - 偵錯模式</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f7f6; padding: 20px; font-family: "Microsoft JhengHei", sans-serif; }
    .card-custom { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    #globalLoading { position: fixed; top: 20px; right: 20px; background: #ffc107; padding: 10px 20px; border-radius: 8px; font-weight: bold; z-index: 1000; }
    .table-responsive { max-height: 60vh; overflow: auto; border: 1px solid #dee2e6; background: #fff; }
    table { width: 100%; min-width: 1000px; border-collapse: separate; border-spacing: 0; }
    thead th { position: sticky; top: 0; background: #212529 !important; color: white; padding: 12px; text-align: center; }
    tbody td { border: 1px solid #ddd; padding: 0 !important; height: 40px; }
    .grid-input { width: 100%; height: 100%; border: none; padding: 8px; text-align: center; }
    .ai-box { background: linear-gradient(135deg, #f0f7ff 0%, #e6f3ff 100%); border: 1px solid #b8daff; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div id="globalLoading" class="hidden">⏳ 系統處理中...</div>

  <div class="container-fluid">
    <div id="adminMain" class="card-custom hidden">
      <h3 class="text-center mb-4">教會服事系統管理</h3>
      <div id="groupButtons" class="d-grid gap-2"></div>
    </div>

    <div id="reportSection" class="card-custom hidden">
      <div class="toolbar d-flex justify-content-between mb-3">
        <div>
          <h4 id="groupTitle" class="d-inline text-primary">載入中...</h4>
          <button class="btn btn-sm btn-outline-secondary ms-3" onclick="debugCheck()">🔍 檢查系統狀態</button>
        </div>
        <button class="btn btn-primary" onclick="saveData()">💾 儲存變更</button>
      </div>

      <div class="ai-box shadow-sm">
        <textarea id="aiRawText" class="form-control mb-2" rows="3" placeholder="請貼上排班文字..."></textarea>
        <button class="btn btn-success w-100" onclick="processAI()">🤖 啟動 AI 解析填入</button>
        <div id="aiStatus" class="form-text mt-1 text-muted">提示：若沒反應，請按 F12 檢查 Console</div>
      </div>

      <div class="table-responsive">
        <table id="mainTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  // --- 基礎設定 ---
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4268IkgwQm2Es0gjDHLU_U9nKJrRMR1-xzbbtuaq08lePLgAQ2wnDRrCeHdy9jNhh/exec";
  const currentId = new URLSearchParams(window.location.search).get('id');
  let activeGroupName = "";
  let currentTableHeaders = []; // 儲存正確標題

  console.log("✅ 腳本已載入，目前 ID:", currentId);

  const showLoading = (msg) => { document.getElementById('globalLoading').innerText = msg; document.getElementById('globalLoading').classList.remove('hidden'); };
  const hideLoading = () => document.getElementById('globalLoading').classList.add('hidden');

  function debugCheck() {
    console.log("--- 🔍 系統診斷 ---");
    console.log("目前分頁 ID:", currentId);
    console.log("目前標題陣列:", currentTableHeaders);
    alert("目前標題是：" + (currentTableHeaders.join(", ") || "空的！請重新整理"));
  }

  // --- 初始化 ---
  window.onload = async () => {
    if (!currentId) {
      showSection('adminMain');
      await loadAdminData();
    } else {
      showSection('reportSection');
      await refreshData();
    }
  };

  async function refreshData() {
    showLoading("⏳ 讀取資料中...");
    try {
      const response = await fetch(`${GAS_URL}?action=getPageConfig&id=${currentId}`);
      const result = await response.json();
      if (result.status === 'success') {
        renderTable(result.data);
      }
    } catch (e) { console.error("初始化失敗", e); }
    finally { hideLoading(); }
  }

  function renderTable(data) {
    activeGroupName = data.groupName;
    document.getElementById('groupTitle').innerText = data.groupName;
    
    // 🌟 從資料核心抓取標題
    currentTableHeaders = data.matrix[0].map(h => h.toString().trim());
    console.log("📍 已儲存標題:", currentTableHeaders);

    document.getElementById('tableHead').innerHTML = `<tr>${currentTableHeaders.map(h => `<th>${h}</th>`).join('')}</tr>`;
    
    let html = "";
    const rows = data.matrix.slice(1);
    for (let i = 0; i < 50; i++) {
      const rowData = rows[i] || Array(currentTableHeaders.length).fill("");
      html += `<tr>`;
      for (let j = 0; j < currentTableHeaders.length; j++) {
        html += `<td><input type="text" class="grid-input" data-r="${i}" data-c="${j}" value="${rowData[j] || ""}"></td>`;
      }
      html += `</tr>`;
    }
    document.getElementById('tableBody').innerHTML = html;
  }

  // --- AI 核心 ---
  async function processAI() {
    console.log("🚀 processAI 觸發");
    const rawText = document.getElementById('aiRawText').value.trim();
    if (!rawText) return alert("請貼上文字");

    showLoading("🤖 AI 正在努力...");
    document.getElementById('aiStatus').innerText = "連線中...";

    try {
      // 1. 取得 GAS 設定
      console.log("1. 取得 AI Config...");
      const configRes = await fetch(`${GAS_URL}?action=getAIConfig`);
      const config = await configRes.json();
      if (config.status !== 'success') throw new Error(config.message);

      // 2. 準備 Prompt
      const headerStr = currentTableHeaders.join(", ");
      const finalPrompt = config.data.promptTemplate.replace(/\{\{HEADERS\}\}/g, headerStr);
      console.log("2. 提示詞準備完成，目前對應標題:", headerStr);

      // 3. 呼叫 Gemini
      console.log("3. 呼叫 Gemini API...");
      const geminiRes = await fetch(config.data.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: finalPrompt + "\n\n資料文字：\n" + rawText }] }] })
      });
      const geminiJson = await geminiRes.json();
      if (geminiJson.error) throw new Error(geminiJson.error.message);

      let aiText = geminiJson.candidates[0].content.parts[0].text;
      aiText = aiText.replace(/```json/gi, "").replace(/```/g, "").trim();
      
      const parsedData = JSON.parse(aiText);
      console.log("4. AI 回傳資料成功:", parsedData);

      // 4. 填入表格
      fillTableWithData(parsedData);
      document.getElementById('aiStatus').innerText = "✅ 解析完成！";

    } catch (err) {
      console.error("❌ 錯誤:", err);
      alert("解析失敗: " + err.message);
    } finally {
      hideLoading();
    }
  }

function fillTableWithData(parsedRows, headers) {
    console.log("📌 開始執行智慧合併填入...");
    const tableRows = document.querySelectorAll('#tableBody tr');
    
    // 1. 找出「日期」欄位的索引位置
    const dateColIdx = headers.indexOf("日期");
    if (dateColIdx === -1) {
      alert("表格中找不到「日期」欄位，無法進行精準比對更新。");
      return;
    }

    // 2. 建立現有表格的日期索引 map: { "2026-03-22": rowElement }
    const dateMap = {};
    tableRows.forEach(tr => {
      const dateVal = tr.querySelectorAll('input')[dateColIdx].value.trim();
      if (dateVal) {
        dateMap[dateVal] = tr;
      }
    });

    // 3. 開始處理 AI 解析出的每一列
    parsedRows.forEach(rowData => {
      const aiDate = rowData["日期"];
      let targetRow = dateMap[aiDate]; // 嘗試尋找相同日期的列

      // 4. 如果找不到相同日期，則尋找第一個完全空白的列作為新列填入
      if (!targetRow) {
        for (let i = 0; i < tableRows.length; i++) {
          const firstInput = tableRows[i].querySelectorAll('input')[0];
          if (firstInput.value.trim() === "") {
            targetRow = tableRows[i];
            break;
          }
        }
      }

      // 5. 進行資料填入 (核心規則：非空才覆蓋)
      if (targetRow) {
        const inputs = targetRow.querySelectorAll('input');
        headers.forEach((header, colIdx) => {
          const newValue = rowData[header];
          
          // ✨ 規則：AI 判斷出來有值才更新；如果是空白或沒抓到，保留原本內容
          if (newValue !== undefined && newValue !== null && String(newValue).trim() !== "") {
            const oldValue = inputs[colIdx].value.trim();
            
            // 只有內容真的不同時才更新，並標註底色
            if (oldValue !== String(newValue).trim()) {
              inputs[colIdx].value = newValue;
              inputs[colIdx].style.backgroundColor = "#fff3cd"; // 用稍微不同的顏色(淡橘)表示「已更新」
            }
          }
        });
      }
    });
    
    console.log("✅ 智慧合併完成！");
  }
  // --- 其他功能 (略) ---
  async function saveData() { /* ... 同前 ... */ }
  async function loadAdminData() { /* ... 同前 ... */ }
  function showSection(id) { document.querySelectorAll('.card-custom').forEach(el => el.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
</script>
</body>
</html>
