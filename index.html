<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教會服事管理系統</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="globalLoading" class="hidden">⏳ 系統處理中...</div>

  <div class="container-fluid">
    
    <div id="adminMain" class="card-custom hidden">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-primary fw-bold m-0">教會服事管理系統</h3>
        <button class="btn btn-sm btn-primary px-3 shadow-sm" onclick="showSection('createSection')">➕ 建立新分頁</button>
      </div>

      <input type="text" id="groupSearch" class="form-control search-box shadow-sm" 
             placeholder="🔍 快速搜尋名稱或分類..." onkeyup="filterGroups()">

      <div id="groupButtons" class="row g-3">
        <p class="text-center text-muted">正在載入清單...</p>
      </div>
    </div>

    <div id="createSection" class="card-custom hidden" style="max-width: 600px;">
      <h4 class="fw-bold mb-4">建立新排班表</h4>
      <form id="createGroupForm">
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">ID (網址參數，例如 VN01)</label>
          <input id="newId" class="form-control" placeholder="系統辨識用 ID" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">顯示名稱</label>
          <input id="newName" class="form-control" placeholder="例如: 葡萄樹A組" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">分類屬性 (選擇模板)</label>
          <select id="templateSelect" class="form-select" required></select>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success flex-grow-1">確認建立</button>
          <button type="button" class="btn btn-light flex-grow-1" onclick="showSection('adminMain')">取消</button>
        </div>
      </form>
    </div>
<div id="publicViewSection" class="card-custom hidden">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <h3 id="publicViewTitle" class="text-primary fw-bold m-0">載入中...</h3>
        <div>
          <button class="btn btn-success shadow-sm fw-bold me-2" onclick="downloadPublicExcel()">📥 下載 Excel</button>
          <button class="btn btn-outline-secondary shadow-sm" onclick="enterEditMode()">⚙️ 管理員登入</button>
        </div>
      </div>
      <div id="publicViewContent" class="table-responsive shadow-sm border rounded">
        </div>
    </div>
<div id="reportSection" class="card-custom hidden">
      
      <div class="toolbar d-flex flex-wrap justify-content-between align-items-center mb-3 gap-3">
        <h4 id="groupTitle" class="text-primary m-0 fw-bold">載入中...</h4>
        
        <div class="d-flex align-items-center gap-2 bg-light p-2 rounded border shadow-sm">
          <span class="text-muted small fw-bold ms-1">📅 日期區間：</span>
          <input type="date" id="startDate" class="form-control form-control-sm" style="width: 125px;">
          <span class="text-muted">~</span>
          <input type="date" id="endDate" class="form-control form-control-sm" style="width: 125px;">
          <button class="btn btn-sm btn-secondary" onclick="filterByDate()">篩選</button>
          <button class="btn btn-sm btn-outline-danger" onclick="clearDateFilter()">清除</button>
        </div>
                <div class="d-flex gap-2">
          <button class="btn btn-info text-white shadow shadow-sm fw-bold" onclick="showBulletinBoard()">📋 產生布告欄</button>
          <button class="btn btn-primary px-4 shadow shadow-sm" onclick="saveData()">💾 儲存變更</button>
        </div>

      </div>

      <div class="mb-3">
        <button class="btn btn-sm btn-outline-secondary shadow-sm" onclick="document.getElementById('promptSettings').classList.toggle('hidden')">
          ⚙️ 設定小組專屬 AI 排班規則
        </button>
        
        <div id="promptSettings" class="hidden mt-2 p-3 bg-light border border-secondary border-opacity-25 rounded shadow-sm">
          <label class="form-label small fw-bold text-primary">告訴 AI 這個小組的排班限制</label>
          <textarea id="groupPromptInput" class="form-control mb-2" rows="2" placeholder="例如：破冰和敬拜必須是同一人、話語分享只能排小明或阿華..."></textarea>
          <div class="d-flex justify-content-end">
            <button class="btn btn-sm btn-primary" onclick="saveGroupPrompt()">💾 儲存規則</button>
          </div>
        </div>
      </div>

      <div class="ai-box shadow-sm">
        <div class="row g-2 align-items-center">
          <div class="col-md-10">
            <textarea id="aiRawText" class="form-control" rows="3" placeholder="💡 您可以：&#10;1. 【直接貼上】已經打好的排班文字，讓 AI 自動填入。&#10;2. 【對話生成】輸入條件讓 AI 自動排班（例：排第三季每個週五，地點在A區，破冰自動挑，話語分享只排小明和阿華）"></textarea>
          </div>
          <div class="col-md-2 d-grid">
            <button class="btn btn-success" onclick="processAI()">🤖 AI 解析</button>
          </div>
        </div>
        <div id="aiStatus" class="form-text text-muted mt-2">✨ 貼上排班文字或輸入排班條件後，點擊解析，系統將自動處理。</div>
      </div>

      <div id="dynamicFormContainer" class="p-3 bg-white border rounded shadow-sm" style="overflow-x: auto; min-height: 300px;">
        </div>
    </div>
  </div>
  <div class="modal fade" id="bulletinModal" tabindex="-1" aria-labelledby="bulletinModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title fw-bold" id="bulletinModalLabel">📋 小組布告欄預覽</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="bulletinContent">
          </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success fw-bold" onclick="downloadExcel()">📥 下載 Excel</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
