    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(to top right, #006030 0%, #30759f 55%, #6bb3f0 100%);
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 96, 48, 0.2);
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .container {
            flex: 1;
            padding: 36px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            border-radius: 16px;
            padding: 28px 20px 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            text-decoration: none;
            color: #2d3748;
            border-top: 4px solid transparent;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.13);
        }

        .card:nth-child(1) { border-top-color: #4a90e2; }
        .card:nth-child(2) { border-top-color: #e06c8a; }
        .card:nth-child(3) { border-top-color: #f5a623; }
        .card:nth-child(4) { border-top-color: #7ed321; }
        .card:nth-child(5) { border-top-color: #9b59b6; }
        .card:nth-child(6) { border-top-color: #1abc9c; }
        .card:nth-child(7) { border-top-color: #e67e22; }
        .card:nth-child(8) { border-top-color: #3498db; }
        .card:nth-child(9) { border-top-color: #808080; }
        .card:nth-child(10) { border-top-color: #16a085; }

        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            font-size: 28px;
        }

        .card:nth-child(1) .icon-wrap { background: #eaf2fd; }
        .card:nth-child(2) .icon-wrap { background: #fdeef3; }
        .card:nth-child(3) .icon-wrap { background: #fef7eb; }
        .card:nth-child(4) .icon-wrap { background: #f2fae8; }
        .card:nth-child(5) .icon-wrap { background: #f5eefa; }
        .card:nth-child(6) .icon-wrap { background: #e8f8f5; }
        .card:nth-child(7) .icon-wrap { background: #fdf3e7; }
        .card:nth-child(8) .icon-wrap { background: #eaf5fd; }
        .card:nth-child(9) .icon-wrap { background: #F5F5F5; }
        .card:nth-child(10) .icon-wrap { background: #e8f8f5; }

        .title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            line-height: 1.5;
            color: #2d3748;
        }

        footer {
            text-align: center;
            padding: 18px;
            font-size: 12px;
            color: #a0aec0;
            border-top: 1px solid #e2e8f0;
            background: white;
        }

        /* 懸浮按鈕樣式 */
        .fab-refresh {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #006030 0%, #30759f 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .fab-refresh:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .fab-refresh:active {
            transform: scale(0.95);
        }

        .fab-refresh[disabled] {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .refresh-icon {
            fill: white;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fab-refresh:hover .refresh-icon {
            transform: rotate(180deg);
        }

        /* 旋轉動畫 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-icon.spinning {
            animation: spin 1s linear infinite;
        }

        /* Tooltip 樣式 */
        .fab-refresh::after {
            content: attr(data-title);
            position: absolute;
            bottom: 60px;
            right: 0;
            background: rgba(45, 55, 72, 0.95);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            pointer-events: none;
            font-family: inherit;
        }

        .fab-refresh:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* Glassmorphism Toast 提示框 */
        .cache-toast {
            position: fixed;
            bottom: 90px;
            right: 24px;
            background: rgba(45, 55, 72, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cache-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<script>
    // 當頁面載入或視窗大小改變時，重新計算對角線漸層
    document.addEventListener('DOMContentLoaded', calculateDiagonalGradients);
    window.addEventListener('resize', calculateDiagonalGradients);

    function calculateDiagonalGradients() {
        const cards = Array.from(document.querySelectorAll('.card'));
        if (cards.length === 0) return;

        // 定義 RGB 起點與終點 (深綠色 #006030 至 天藍色 #4a90e2)
        const startColor = { r: 0, g: 96, b: 48 };
        const endColor = { r: 74, g: 144, b: 226 };

        let minScore = Infinity;
        let maxScore = -Infinity;

        // 依據 (offsetLeft - offsetTop) 計算每個卡片在對角線上的投影得分
        const cardData = cards.map(card => {
            const x = card.offsetLeft;
            const y = card.offsetTop;
            const score = x - y;
            if (score < minScore) minScore = score;
            if (score > maxScore) maxScore = score;
            return { card, score };
        });

        cardData.forEach(item => {
            const ratio = maxScore !== minScore ? (item.score - minScore) / (maxScore - minScore) : 0.5;

            // 插值 RGB
            const r = Math.round(startColor.r + ratio * (endColor.r - startColor.r));
            const g = Math.round(startColor.g + ratio * (endColor.g - startColor.g));
            const b = Math.round(startColor.b + ratio * (endColor.b - startColor.b));

            // 套用顏色
            item.card.style.borderTopColor = `rgb(${r}, ${g}, ${b})`;
            
            const iconWrap = item.card.querySelector('.icon-wrap');
            if (iconWrap) {
                iconWrap.style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.1)`;
            }
        });
    }

    // 監聽 DOMContentLoaded 以確保按鈕與 Toast 元素已載入
    document.addEventListener('DOMContentLoaded', function() {
        // 取得懸浮按鈕、圖示與 Toast 元素
        const btnRefresh = document.getElementById('btn-refresh-cache');
        const refreshIcon = btnRefresh ? btnRefresh.querySelector('.refresh-icon') : null;
        const cacheToast = document.getElementById('cache-toast');

        if (btnRefresh) {
            btnRefresh.addEventListener('click', async function() {
                // 1. 停用按鈕並加入旋轉動畫
                btnRefresh.disabled = true;
                if (refreshIcon) {
                    refreshIcon.classList.add('spinning');
                }

                // 2. 顯示 Toast 提示
                if (cacheToast) {
                    cacheToast.classList.add('show');
                }

                // 3. 清理快取邏輯
                try {
                    // 清除 caches API 儲存的快取
                    if ('caches' in window) {
                        const cacheKeys = await caches.keys();
                        await Promise.all(
                            cacheKeys.map(key => caches.delete(key))
                        );
                        console.log('✅ ServiceWorker cache storage cleared.');
                    }

                    // 登出所有已註冊的 Service Workers
                    if ('serviceWorker' in navigator) {
                        const registrations = await navigator.serviceWorker.getRegistrations();
                        await Promise.all(
                            registrations.map(reg => reg.unregister())
                        );
                        console.log('✅ ServiceWorkers unregistered.');
                    }
                } catch (err) {
                    console.warn('❌ Cache cleanup encountered an error:', err);
                }

                // 4. 延遲 1 秒以提供視覺回饋後重新載入
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            });
        }
    });
</script>
