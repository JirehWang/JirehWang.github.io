<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教會服事管理系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f7f6; padding: 20px; font-family: "Microsoft JhengHei", sans-serif; }
    .card-custom { max-width: 1300px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    #globalLoading { position: fixed; top: 20px; right: 20px; background: #ffc107; padding: 10px 20px; border-radius: 8px; font-weight: bold; z-index: 1000; }
    
    /* 🌟 儀表板優化 */
    #adminMain { max-width: 1150px; }
    .category-header { 
      color: #2c3e50; font-weight: 800; padding: 15px 0 10px 0; margin-top: 1.5rem;
      border-bottom: 2px solid #dee2e6; display: flex; align-items: center; width: 100%;
    }
    .category-badge { font-size: 0.85rem; margin-left: 10px; background: #f8f9fa; color: #6c757d; border: 1px solid #dee2e6; border-radius: 20px; padding: 1px 10px; }
    
    .group-card { transition: all 0.2s; border: 1px solid #eee; }
    .group-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08) !important; border-color: #0d6efd; }
    
    /* 文字點擊區樣式 */
    .group-link { text-decoration: none !important; color: inherit; display: block; }
    .group-link:hover .card-title { color: #0d6efd !important; }
    
    .search-box { margin-bottom: 1.5rem; border-radius: 30px; padding-left: 20px; border: 2px solid #ced4da; }
    
    /* 表格編輯區 */
    .table-responsive { max-height: 65vh; overflow: auto; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; }
    table { width: auto; min-width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    thead th { position: sticky; top: 0; background: #212529 !important; color: white; padding: 12px; text-align: center; border: 1px solid #373b3e; z-index: 10; font-size: 14px; }
    .resizer { position: absolute; right: 0; top: 0; width: 6px; height: 100%; cursor: col-resize; user-select: none; }
    .resizer:hover, .resizing { background-color: #0d6efd; width: 3px; }
    tbody td { border: 1px solid #ddd; padding: 0 !important; height: 40px; }
    .grid-input { width: 100%; height: 100%; border: none; background: transparent; padding: 8px 12px; text-align: center; outline: none; font-size: 14px; }
    .grid-input:focus { background-color: #f8f9fa; box-shadow: inset 0 0 0 2px #0d6efd; }
    .ai-box { background: linear-gradient(135deg, #f0f7ff 0%, #e6f3ff 100%); border: 1px solid #b8daff; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div id="globalLoading" class="hidden">⏳ 系統處理中...</div>

  <div class="container-fluid">
    <div id="adminMain" class="card-custom hidden">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-primary fw-bold m-0">教會服事管理系統</h3>
        <button class="btn btn-sm btn-primary px-3 shadow-sm" onclick="showSection('createSection')">➕ 建立新分頁</button>
      </div>

      <input type="text" id="groupSearch" class="form-control search-box shadow-sm" 
             placeholder="🔍 快速搜尋小組名稱、ID 或分類..." onkeyup="filterGroups()">

      <div id="groupButtons" class="row g-3">
        <p class="text-center text-muted">正在載入清單...</p>
      </div>
    </div>

    <div id="createSection" class="card-custom hidden" style="max-width: 600px;">
      <h4 class="fw-bold mb-4">建立新排班表</h4>
      <form id="createGroupForm">
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">ID (網址參數)</label>
          <input id="newId" class="form-control" placeholder="例如: VN01" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">名稱 (分頁顯示)</label>
          <input id="newName" class="form-control" placeholder="例如: 葡萄樹A組" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">分類屬性 (選擇模板)</label>
          <select id="templateSelect" class="form-select" required></select>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success flex-grow-1">確認建立</button>
          <button type="button" class="btn btn-light flex-grow-1" onclick="showSection('adminMain')">取消</button>
        </div>
      </form>
    </div>

    <div id="reportSection" class="card-custom hidden">
      <div class="toolbar d-flex justify-content-between align-items-center mb-3">
        <div>
          <button class="btn btn-sm btn-outline-secondary me-3" onclick="location.reload()">⬅ 返回</button>
          <h4 id="groupTitle" class="text-primary m-0 d-inline align-middle fw-bold">載入中...</h4>
        </div>
        <button class="btn btn-primary px-4 shadow" onclick="saveData()">💾 儲存變更</button>
      </div>

      <div class="ai-box shadow-sm">
        <div class="row g-2 align-items-center">
          <div class="col-md-10"><textarea id="aiRawText" class="form-control" rows="2" placeholder="在此貼上排班文字..."></textarea></div>
          <div class="col-md-2 d-grid"><button class="btn btn-success" onclick="processAI()">🤖 AI 解析</button></div>
        </div>
      </div>

      <div class="table-responsive">
        <table id="mainTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
      </div>
    </div>
  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4268IkgwQm2Es0gjDHLU_U9nKJrRMR1-xzbbtuaq08lePLgAQ2wnDRrCeHdy9jNhh/exec"; 
  const currentId = new URLSearchParams(window.location.search).get('id');
  let activeGroupName = "";
  let currentTableHeaders = [];

  const showLoading = (msg) => { const el = document.getElementById('globalLoading'); el.innerText = msg; el.classList.remove('hidden'); };
  const hideLoading = () => document.getElementById('globalLoading').classList.add('hidden');

  async function fetchAPI(action, params = {}) {
    let url = new URL(GAS_URL);
    url.searchParams.append('action', action);
    for (let key in params) url.searchParams.append(key, params[key]);
    const response = await fetch(url);
    const result = await response.json();
    if (result.status !== 'success') throw new Error(result.message);
    return result.data;
  }

  window.onload = async () => {
    if (!currentId) { showSection('adminMain'); await loadAdminData(); } 
    else { showSection('reportSection'); try { const data = await fetchAPI('getPageConfig', { id: currentId }); renderTable(data); } catch(e){alert(e.message);} }
  };

// 🌟 標籤跳轉版：點擊 ID 標籤進入管理
  async function loadAdminData() {
    try {
      showLoading("⏳ 整理儀表板中...");
      const [groups, templates] = await Promise.all([fetchAPI('getGroups'), fetchAPI('getTemplates')]);
      const div = document.getElementById('groupButtons');
      const base = window.location.href.split('?')[0];
      
      const grouped = groups.reduce((acc, g) => {
        const cat = g.template || "未分類項目";
        if (!acc[cat]) acc[cat] = [];
        acc[cat].push(g);
        return acc;
      }, {});

      let html = "";
      for (const cat in grouped) {
        html += `<div class="col-12 category-section" data-cat="${cat}"><div class="category-header">📦 ${cat} <span class="category-badge">${grouped[cat].length}</span></div></div>`;
        
        html += grouped[cat].map(g => {
          const isEnabled = g.status !== "停用"; 
          return `
            <div class="col-12 col-md-4 group-item" data-search="${g.name} ${g.id} ${g.template}">
              <div class="card group-card h-100 shadow-sm" style="opacity: ${isEnabled ? '1' : '0.5'}; border-left: 5px solid ${isEnabled ? '#0d6efd' : '#ced4da'};">
                <div class="card-body p-3">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <a href="${isEnabled ? base + '?id=' + g.id : 'javascript:void(0)'}" 
                       class="badge ${isEnabled ? 'bg-primary' : 'bg-secondary'} text-decoration-none shadow-sm" 
                       style="padding: 6px 12px; cursor: ${isEnabled ? 'pointer' : 'not-allowed'}; font-size: 0.85rem;">
                       ${g.id} <span style="font-size: 0.7rem;">➔</span>
                    </a>
                    <span class="badge ${isEnabled ? 'bg-success' : 'bg-secondary'}" style="font-size: 0.7rem;">${g.status}</span>
                  </div>
                  
                  <h6 class="fw-bold text-dark m-0 mt-1">${g.name}</h6>

                  <div class="text-end mt-2">
                    <button class="btn btn-sm ${isEnabled ? 'btn-outline-danger' : 'btn-outline-success'}" 
                            style="font-size: 0.7rem; padding: 1px 6px; border-radius: 4px;"
                            onclick="toggleStatus('${g.id}', '${g.status}')">
                      ${isEnabled ? '停用' : '啟用'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }
      div.innerHTML = html || '<p class="text-center text-muted">目前尚無資料</p>';
      document.getElementById('templateSelect').innerHTML = '<option value="" disabled selected>選擇模板</option>' + templates.map(t=>`<option value="${t}">${t}</option>`).join('');
    } catch (err) { div.innerHTML = '<p class="text-danger">載入失敗</p>'; } finally { hideLoading(); }
  }
  function filterGroups() {
    const val = document.getElementById('groupSearch').value.toLowerCase();
    document.querySelectorAll('.group-item').forEach(el => {
      el.style.display = el.dataset.search.toLowerCase().includes(val) ? "" : "none";
    });
    document.querySelectorAll('.category-section').forEach(header => {
      let hasVisible = false;
      let next = header.nextElementSibling;
      while (next && next.classList.contains('group-item')) {
        if (next.style.display !== "none") hasVisible = true;
        next = next.nextElementSibling;
      }
      header.style.display = hasVisible ? "" : "none";
    });
  }

  function renderTable(data) {
    activeGroupName = data.groupName;
    document.getElementById('groupTitle').innerText = data.groupName;
    currentTableHeaders = data.matrix[0].map(h => h.toString().trim());
    const theadHTML = currentTableHeaders.map(h => `<th style="width: 150px; position: relative;">${h}<div class="resizer"></div></th>`).join('');
    document.getElementById('tableHead').innerHTML = `<tr>${theadHTML}</tr>`;
    const rows = data.matrix.slice(1);
    let html = "";
    for (let i = 0; i < 50; i++) {
      const rowData = rows[i] || Array(currentTableHeaders.length).fill("");
      html += `<tr>`;
      for (let j = 0; j < currentTableHeaders.length; j++) html += `<td><input type="text" class="grid-input" value="${rowData[j] || ""}" title="${rowData[j] || ""}"></td>`;
      html += `</tr>`;
    }
    document.getElementById('tableBody').innerHTML = html;
    initResizable();
  }

  function initResizable() {
    const table = document.getElementById('mainTable');
    const cols = table.querySelectorAll('th');
    [].forEach.call(cols, (col) => {
      const resizer = col.querySelector('.resizer');
      if (!resizer) return;
      let x = 0, w = 0;
      const onMouseDown = (e) => {
        x = e.clientX; w = parseInt(window.getComputedStyle(col).width, 10);
        document.addEventListener('mousemove', onMouseMove); document.addEventListener('mouseup', onMouseUp);
        resizer.classList.add('resizing');
      };
      const onMouseMove = (e) => { const dx = e.clientX - x; col.style.width = `${w + dx}px`; };
      const onMouseUp = () => { document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); resizer.classList.remove('resizing'); };
      resizer.addEventListener('mousedown', onMouseDown);
    });
  }

  async function processAI() {
    const rawText = document.getElementById('aiRawText').value.trim();
    if (!rawText) return alert("請貼上文字");
    showLoading("🤖 AI 解析中...");
    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "parseWithAI", data: { text: rawText, headers: currentTableHeaders } })
      });
      const resJson = await response.json();
      if (resJson.status !== 'success') throw new Error(resJson.message);
      fillTableWithData(resJson.data);
      document.getElementById('aiStatus').innerText = "✅ 完成！";
      document.getElementById('aiRawText').value = ""; 
    } catch (err) { alert("解析失敗：" + err.message); } finally { hideLoading(); }
  }

  function fillTableWithData(parsedRows) {
    const tableRows = document.querySelectorAll('#tableBody tr');
    const dateColIdx = currentTableHeaders.indexOf("日期");
    const dateMap = {};
    tableRows.forEach(tr => { const d = tr.querySelectorAll('input')[dateColIdx]?.value.trim(); if(d) dateMap[d] = tr; });
    parsedRows.forEach(rowData => {
      let targetRow = dateMap[rowData["日期"]];
      if (!targetRow) for (let tr of tableRows) if (tr.querySelectorAll('input')[0].value.trim() === "") { targetRow = tr; break; }
      if (targetRow) {
        const inputs = targetRow.querySelectorAll('input');
        currentTableHeaders.forEach((header, colIdx) => {
          const val = rowData[header];
          if (val && val !== "") { inputs[colIdx].value = val; inputs[colIdx].style.backgroundColor = "#fff3cd"; }
        });
      }
    });
  }

  async function saveData() {
    showLoading("💾 儲存中...");
    try {
      const matrix = [currentTableHeaders];
      document.querySelectorAll('#tableBody tr').forEach(tr => {
        const row = Array.from(tr.querySelectorAll('input')).map(i => i.value);
        if (row.some(v => v.trim() !== "")) matrix.push(row);
      });
      while(matrix.length <= 50) matrix.push(Array(currentTableHeaders.length).fill(""));
      await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "saveSheetData", data: { groupName: activeGroupName, matrix: matrix } })
      });
      alert("✅ 儲存成功！");
      document.querySelectorAll('.grid-input').forEach(i => i.style.backgroundColor = 'transparent');
    } catch (e) { alert("儲存失敗"); } finally { hideLoading(); }
  }

  async function toggleStatus(groupId, currentStatus) {
    showLoading("🔄 更新中...");
    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "toggleGroupStatus", data: { id: groupId, status: currentStatus } })
      });
      if ((await response.json()).status === 'success') await loadAdminData();
    } catch (e) { alert("更新失敗"); } finally { hideLoading(); }
  }

  function showSection(id) {
    document.querySelectorAll('.card-custom').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  const createForm = document.getElementById('createGroupForm');
  if (createForm) {
    createForm.onsubmit = async function(e) {
      e.preventDefault(); showLoading("建立中...");
      try {
        await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "createGroup", data: { id: document.getElementById('newId').value, name: document.getElementById('newName').value, template: document.getElementById('templateSelect').value } }) });
        location.reload();
      } catch (e) { alert("失敗"); } finally { hideLoading(); }
    };
  }
</script>
</body>
</html>
