<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林口教會管理系統</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(5, 150, 105, 0.15);
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .container {
            flex: 1;
            padding: 36px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            border-radius: 16px;
            padding: 28px 20px 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            text-decoration: none;
            color: #2d3748;
            border-top: 4px solid transparent;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.13);
        }

        .card:nth-child(1) { border-top-color: #059669; }
        .card:nth-child(2) { border-top-color: #0c9e72; }
        .card:nth-child(3) { border-top-color: #12a67a; }
        .card:nth-child(4) { border-top-color: #1aa67f; }
        .card:nth-child(5) { border-top-color: #20b087; }
        .card:nth-child(6) { border-top-color: #27b68e; }
        .card:nth-child(7) { border-top-color: #2ebc96; }
        .card:nth-child(8) { border-top-color: #35c39e; }
        .card:nth-child(9) { border-top-color: #3cc9a6; }
        .card:nth-child(10) { border-top-color: #43d0ae; }

        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            font-size: 28px;
        }

        .card:nth-child(1) .icon-wrap { background: rgba(5, 150, 105, 0.1); }
        .card:nth-child(2) .icon-wrap { background: rgba(12, 158, 114, 0.1); }
        .card:nth-child(3) .icon-wrap { background: rgba(18, 166, 122, 0.1); }
        .card:nth-child(4) .icon-wrap { background: rgba(26, 166, 127, 0.1); }
        .card:nth-child(5) .icon-wrap { background: rgba(32, 176, 135, 0.1); }
        .card:nth-child(6) .icon-wrap { background: rgba(39, 182, 142, 0.1); }
        .card:nth-child(7) .icon-wrap { background: rgba(46, 188, 150, 0.1); }
        .card:nth-child(8) .icon-wrap { background: rgba(53, 195, 158, 0.1); }
        .card:nth-child(9) .icon-wrap { background: rgba(60, 201, 166, 0.1); }
        .card:nth-child(10) .icon-wrap { background: rgba(67, 208, 174, 0.1); }

        .title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            line-height: 1.5;
            color: #2d3748;
        }

        footer {
            text-align: center;
            padding: 18px;
            font-size: 12px;
            color: #a0aec0;
            border-top: 1px solid #e2e8f0;
            background: white;
        }

        /* 懸浮按鈕樣式 */
        .fab-refresh {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .fab-refresh:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .fab-refresh:active {
            transform: scale(0.95);
        }

        .fab-refresh[disabled] {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .refresh-icon {
            fill: white;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fab-refresh:hover .refresh-icon {
            transform: rotate(180deg);
        }

        /* 旋轉動畫 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-icon.spinning {
            animation: spin 1s linear infinite;
        }

        /* Tooltip 樣式 */
        .fab-refresh::after {
            content: attr(data-title);
            position: absolute;
            bottom: 60px;
            right: 0;
            background: rgba(45, 55, 72, 0.95);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            pointer-events: none;
            font-family: inherit;
        }

        .fab-refresh:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* Glassmorphism Toast 提示框 */
        .cache-toast {
            position: fixed;
            bottom: 90px;
            right: 24px;
            background: rgba(45, 55, 72, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cache-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .cache-panel {
            position: fixed;
            inset: 0;
            z-index: 1002;
            display: none;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 24px;
            background: rgba(15, 23, 42, 0.18);
        }

        .cache-panel.show {
            display: flex;
        }

        .cache-panel-card {
            width: min(420px, calc(100vw - 32px));
            background: white;
            border: 1px solid #dbe3ea;
            border-radius: 10px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.22);
            padding: 18px;
        }

        .cache-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .cache-panel-title {
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
        }

        .cache-panel-close {
            border: 0;
            background: #f1f5f9;
            color: #334155;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .cache-panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .cache-action {
            border: 1px solid #dbe3ea;
            background: #f8fafc;
            color: #1f2937;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
        }

        .cache-action:hover {
            background: #ecfdf5;
            border-color: #10b981;
        }

        .cache-action.danger {
            background: #fff7ed;
            border-color: #fed7aa;
        }

        .cache-action.utility {
            grid-column: 1 / -1;
            background: #f8fafc;
        }

        .cache-panel-note {
            margin: 12px 0 0;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 560px) {
            .cache-panel {
                justify-content: center;
                padding: 16px;
            }

            .cache-panel-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<script>
    // 當頁面載入或視窗大小改變時，重新計算對角線漸層
    document.addEventListener('DOMContentLoaded', calculateDiagonalGradients);
    window.addEventListener('resize', calculateDiagonalGradients);

    function calculateDiagonalGradients() {
        const cards = Array.from(document.querySelectorAll('.card'));
        if (cards.length === 0) return;

        // 定義 RGB 起點與終點 (清新綠 #059669 至 薄荷綠 #34d399)
        const startColor = { r: 5, g: 150, b: 105 };
        const endColor = { r: 52, g: 211, b: 153 };

        let minScore = Infinity;
        let maxScore = -Infinity;

        // 依據 (offsetLeft - offsetTop) 計算每個卡片在對角線上的投影得分
        const cardData = cards.map(card => {
            const x = card.offsetLeft;
            const y = card.offsetTop;
            const score = x - y;
            if (score < minScore) minScore = score;
            if (score > maxScore) maxScore = score;
            return { card, score };
        });

        cardData.forEach(item => {
            const ratio = maxScore !== minScore ? (item.score - minScore) / (maxScore - minScore) : 0.5;

            // 插值 RGB
            const r = Math.round(startColor.r + ratio * (endColor.r - startColor.r));
            const g = Math.round(startColor.g + ratio * (endColor.g - startColor.g));
            const b = Math.round(startColor.b + ratio * (endColor.b - startColor.b));

            // 套用顏色
            item.card.style.borderTopColor = `rgb(${r}, ${g}, ${b})`;
            
            const iconWrap = item.card.querySelector('.icon-wrap');
            if (iconWrap) {
                iconWrap.style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.1)`;
            }
        });
    }

    const CACHE_GROUPS = {
        group: {
            label: '小組點名資料',
            topics: ['getGroups', 'getAdminGroupsList', 'checkGroupStatus', 'getStats', 'getAllGroupsStats', 'getWeeklyReport', 'getMemberSuggestions', 'getAllGroupMembers'],
            backendRefresh: 'refreshGroupCaches'
        },
        sunday: {
            label: '主日出席資料',
            topics: ['getSmartAttendanceList', 'getGroupConfig', 'getAllMembers', 'getWeeklyReport', 'getAttendanceStats', 'getAttendanceTrend', 'getCategoryChartData'],
            backendRefresh: 'refreshAttendanceCaches'
        },
        ministry: {
            label: '事工管理資料',
            topics: ['ministry_getGroups', 'ministry_getTemplates', 'ministry_getPageConfig', 'ministry_getAggregatedReport', 'ministry_getGroupMembers'],
            backendRefresh: 'ministry_refreshCaches'
        },
        worship: {
            label: '敬拜團資料',
            topics: [
                'getSchedule', 'getScheduleByDateRange', 'getPositions', 'getTeamMembers', 'getSongs',
                'worship_getSchedule', 'worship_getScheduleByDateRange', 'worship_getPositions', 'worship_getTeamMembers', 'worship_getSongs'
            ],
            backendRefresh: 'worship_refreshCaches'
        },
        calendar: {
            label: '教會行事曆資料',
            topics: ['cal_getTypes', 'cal_getFields', 'cal_getEvents', 'cal_getEvent']
        }
    };

    function uniqueTopics(topics) {
        return Array.from(new Set(topics));
    }

    function setCacheUiBusy(isBusy, message) {
        const btnRefresh = document.getElementById('btn-refresh-cache');
        const refreshIcon = btnRefresh ? btnRefresh.querySelector('.refresh-icon') : null;
        const cacheToast = document.getElementById('cache-toast');

        if (btnRefresh) btnRefresh.disabled = isBusy;
        if (refreshIcon) refreshIcon.classList.toggle('spinning', isBusy);
        if (cacheToast) {
            cacheToast.textContent = message || '處理中...';
            cacheToast.classList.toggle('show', isBusy);
        }
    }

    function showResultToast(message) {
        const cacheToast = document.getElementById('cache-toast');
        if (!cacheToast) return;
        cacheToast.textContent = message;
        cacheToast.classList.add('show');
        setTimeout(() => cacheToast.classList.remove('show'), 2600);
    }

    async function deleteFirebaseTopics(topics) {
        const cacheModule = await import('./firebase/firebase-cache.js');
        const targetTopics = uniqueTopics(topics);
        await Promise.all(targetTopics.map(topic => cacheModule.cacheDeleteAll(topic)));
        return targetTopics.length;
    }

    async function refreshBackendCache(action) {
        if (!action) return null;
        const response = await fetch('https://script.google.com/macros/s/AKfycbxBOFeLiXu23kBMGU8iSvRyJci6fruTfk7HdahhcQFY777sCPSgasuNM7Z1CeuzuS-r/exec', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
                action: action,
                token: 'ChurchApp-2026',
                data: {}
            })
        });
        const result = await response.json();
        const nested = result && result.data;
        const failed =
            (result && result.success === false) ||
            (result && result.status === 'error') ||
            (nested && nested.success === false) ||
            (nested && nested.status === 'error');
        if (failed) {
            throw new Error((nested && nested.message) || result.message || '後端快取重建失敗');
        }
        return result;
    }

    async function clearDataCache(groupKey) {
        const config = CACHE_GROUPS[groupKey];
        if (!config) return;
        setCacheUiBusy(true, '正在更新「' + config.label + '」快取...');
        try {
            if (config.backendRefresh) {
                await refreshBackendCache(config.backendRefresh);
            }
            const count = await deleteFirebaseTopics(config.topics);
            showResultToast('✅ 已清除「' + config.label + '」' + count + ' 個資料快取');
        } catch (err) {
            console.warn('資料快取清除失敗:', err);
            showResultToast('❌ 資料快取清除失敗，請稍後再試');
        } finally {
            setCacheUiBusy(false);
        }
    }

    async function clearAllDataCache() {
        if (!confirm('這會清除所有系統的資料快取，短時間內可能讓各系統重新讀取 GAS 並變慢。確定要繼續嗎？')) return;
        const topics = Object.values(CACHE_GROUPS).flatMap(group => group.topics);
        const backendRefreshes = uniqueTopics(Object.values(CACHE_GROUPS).map(group => group.backendRefresh).filter(Boolean));
        setCacheUiBusy(true, '正在清除全部資料快取...');
        try {
            await Promise.all(backendRefreshes.map(action => refreshBackendCache(action)));
            const count = await deleteFirebaseTopics(topics);
            showResultToast('✅ 已清除全部資料快取（' + count + ' 個 topic）');
        } catch (err) {
            console.warn('全部資料快取清除失敗:', err);
            showResultToast('❌ 全部資料快取清除失敗，請稍後再試');
        } finally {
            setCacheUiBusy(false);
        }
    }

    async function repairFrontendCache() {
        if (!confirm('這會清除本機 PWA/前端快取並重新載入，但不會清除雲端資料快取。確定要繼續嗎？')) return;
        setCacheUiBusy(true, '正在修復前端版本/PWA...');
        try {
            if ('caches' in window) {
                const cacheKeys = await caches.keys();
                await Promise.all(cacheKeys.map(key => caches.delete(key)));
            }

            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map(async reg => {
                    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    if (typeof reg.update === 'function') await reg.update().catch(() => {});
                }));
            }

            sessionStorage.clear();
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('nocache', Date.now().toString());
            window.location.href = newUrl.toString();
        } catch (err) {
            console.warn('前端/PWA 修復失敗:', err);
            showResultToast('❌ 前端/PWA 修復失敗，請稍後再試');
            setCacheUiBusy(false);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const btnRefresh = document.getElementById('btn-refresh-cache');
        const panel = document.getElementById('cache-panel');
        const closeBtn = document.getElementById('cache-panel-close');

        if (btnRefresh && panel) {
            btnRefresh.addEventListener('click', function() {
                panel.classList.add('show');
            });
        }
        if (closeBtn && panel) {
            closeBtn.addEventListener('click', function() {
                panel.classList.remove('show');
            });
        }
        if (panel) {
            panel.addEventListener('click', function(event) {
                if (event.target === panel) panel.classList.remove('show');
            });
        }

        document.querySelectorAll('[data-cache-group]').forEach(button => {
            button.addEventListener('click', function() {
                panel.classList.remove('show');
                clearDataCache(button.dataset.cacheGroup);
            });
        });

        const allDataBtn = document.getElementById('cache-clear-all-data');
        if (allDataBtn) {
            allDataBtn.addEventListener('click', function() {
                panel.classList.remove('show');
                clearAllDataCache();
            });
        }

        const repairFrontendBtn = document.getElementById('cache-repair-frontend');
        if (repairFrontendBtn) {
            repairFrontendBtn.addEventListener('click', function() {
                panel.classList.remove('show');
                repairFrontendCache();
            });
        }
    });
</script>

            <button id="cache-repair-frontend" class="cache-action utility" type="button">修復前端版本 / PWA</button>
        </div>
        <p class="cache-panel-note">資料快取只清指定系統的 Firebase cache；前端/PWA 修復只處理本機前端檔案快取，不清雲端資料。</p>
    </div>
</div>

<div id="cache-toast" class="cache-toast">
    正在更新資料快取...
</div>

</body>
