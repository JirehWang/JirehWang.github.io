<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教會服事管理系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f7f6; padding: 20px; font-family: "Microsoft JhengHei", sans-serif; }
    .card-custom { max-width: 1300px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    #globalLoading { position: fixed; top: 20px; right: 20px; background: #ffc107; padding: 10px 20px; border-radius: 8px; font-weight: bold; z-index: 1000; }
    
    /* 表格容器與調整大小相關樣式 */
    .table-responsive { max-height: 65vh; overflow: auto; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; }
    table { width: auto; min-width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; } /* 改為 fixed 才能精準控制寬度 */
    
    thead th { 
      position: sticky; top: 0; background: #212529 !important; color: white; 
      padding: 12px; text-align: center; border: 1px solid #373b3e; 
      white-space: nowrap; font-size: 14px; z-index: 10;
      overflow: hidden; text-overflow: ellipsis;
    }

    /* 🌟 欄位調整條樣式 */
    .resizer {
      position: absolute; right: 0; top: 0; width: 6px; height: 100%;
      cursor: col-resize; user-select: none; background-color: transparent;
    }
    .resizer:hover, .resizing { background-color: #0d6efd; width: 3px; }

    tbody td { border: 1px solid #ddd; padding: 0 !important; height: 40px; }
    
    .grid-input { 
      width: 100%; height: 100%; border: none; background: transparent; 
      padding: 8px 12px; text-align: center; outline: none; font-size: 14px; 
      transition: background-color 0.2s; overflow: hidden; text-overflow: ellipsis;
    }
    .grid-input:focus { background-color: #f8f9fa; box-shadow: inset 0 0 0 2px #0d6efd; }
    
    .ai-box { background: linear-gradient(135deg, #f0f7ff 0%, #e6f3ff 100%); border: 1px solid #b8daff; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div id="globalLoading" class="hidden">⏳ 系統處理中...</div>

  <div class="container-fluid">
    <div id="adminMain" class="card-custom hidden" style="max-width: 600px;">
      <h3 class="text-center mb-4 text-primary">教會服事系統管理</h3>
      <div id="groupButtons" class="d-grid gap-2"><p class="text-center text-muted">正在載入清單...</p></div>
      <hr>
      <button class="btn btn-primary w-100" onclick="showSection('createSection')">➕ 建立新分頁</button>
    </div>

    <div id="createSection" class="card-custom hidden" style="max-width: 600px;">
      <h4>建立新分頁</h4>
      <form id="createGroupForm">
        <div class="mb-3"><input id="newId" class="form-control" placeholder="ID (例: worship)" required></div>
        <div class="mb-3"><input id="newName" class="form-control" placeholder="名稱" required></div>
        <div class="mb-3"><select id="templateSelect" class="form-select" required></select></div>
        <button type="submit" class="btn btn-success w-100">確認建立</button>
        <button type="button" class="btn btn-link w-100" onclick="showSection('adminMain')">取消</button>
      </form>
    </div>

    <div id="reportSection" class="card-custom hidden">
      <div class="toolbar d-flex justify-content-between align-items-center mb-3">
        <div>
          <h4 id="groupTitle" class="text-primary m-0 d-inline">載入中...</h4>
          <span class="ms-3 text-muted small">💡 提示：可拖動表頭右側邊界調整寬度</span>
        </div>
        <button class="btn btn-primary btn-lg px-4" onclick="saveData()">💾 儲存變更</button>
      </div>

      <div class="ai-box shadow-sm">
        <h6 class="text-primary fw-bold mb-2">✨ AI 智慧排班小幫手</h6>
        <div class="row g-2 align-items-end">
          <div class="col-md-10"><textarea id="aiRawText" class="form-control" rows="2" placeholder="貼上排班文字..."></textarea></div>
          <div class="col-md-2 d-grid"><button class="btn btn-primary" onclick="processAI()">🤖 解析填入</button></div>
        </div>
        <div id="aiStatus" class="form-text text-muted mt-1">AI 解析後，內容若過長，您可以手動拉寬欄位查看。</div>
      </div>

      <div class="table-responsive">
        <table id="mainTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4268IkgwQm2Es0gjDHLU_U9nKJrRMR1-xzbbtuaq08lePLgAQ2wnDRrCeHdy9jNhh/exec"; 
  const currentId = new URLSearchParams(window.location.search).get('id');
  let activeGroupName = "";
  let currentTableHeaders = [];

  const showLoading = (msg) => { const el = document.getElementById('globalLoading'); el.innerText = msg; el.classList.remove('hidden'); };
  const hideLoading = () => document.getElementById('globalLoading').classList.add('hidden');

  async function fetchAPI(action, params = {}) {
    let url = new URL(GAS_URL);
    url.searchParams.append('action', action);
    for (let key in params) { url.searchParams.append(key, params[key]); }
    const response = await fetch(url);
    const result = await response.json();
    if (result.status !== 'success') throw new Error(result.message);
    return result.data;
  }

  window.onload = async () => {
    if (!currentId) { showSection('adminMain'); await loadAdminData(); } 
    else { showSection('reportSection'); try { const data = await fetchAPI('getPageConfig', { id: currentId }); renderTable(data); } catch(e){alert(e.message);} }
  };

  function renderTable(data) {
    activeGroupName = data.groupName;
    document.getElementById('groupTitle').innerText = data.groupName;
    currentTableHeaders = data.matrix[0].map(h => h.toString().trim());
    
    // 🌟 渲染表頭並注入調整大小的「手柄」
    const theadHTML = currentTableHeaders.map(h => `
      <th style="width: 150px; position: relative;">
        ${h}
        <div class="resizer"></div>
      </th>
    `).join('');
    document.getElementById('tableHead').innerHTML = `<tr>${theadHTML}</tr>`;
    
    const rows = data.matrix.slice(1);
    let html = "";
    for (let i = 0; i < 50; i++) {
      const rowData = rows[i] || Array(currentTableHeaders.length).fill("");
      html += `<tr>`;
      for (let j = 0; j < currentTableHeaders.length; j++) {
        html += `<td><input type="text" class="grid-input" value="${rowData[j] || ""}" title="${rowData[j] || ""}"></td>`;
      }
      html += `</tr>`;
    }
    document.getElementById('tableBody').innerHTML = html;
    
    // 初始化拖曳功能
    initResizable();
  }

  // 🌟 核心功能：初始化欄位拖曳調整大小
  function initResizable() {
    const table = document.getElementById('mainTable');
    const cols = table.querySelectorAll('th');
    
    [].forEach.call(cols, (col) => {
      const resizer = col.querySelector('.resizer');
      if (!resizer) return;
      
      let x = 0;
      let w = 0;

      const onMouseDown = (e) => {
        x = e.clientX;
        const styles = window.getComputedStyle(col);
        w = parseInt(styles.width, 10);

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        resizer.classList.add('resizing');
      };

      const onMouseMove = (e) => {
        const dx = e.clientX - x;
        col.style.width = `${w + dx}px`;
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        resizer.classList.remove('resizing');
      };

      resizer.addEventListener('mousedown', onMouseDown);
    });
  }

  // --- AI 與儲存邏輯 (維持不變) ---
  async function processAI() {
    const rawText = document.getElementById('aiRawText').value.trim();
    if (!rawText) return alert("請貼上文字");
    showLoading("🤖 AI 正在後端安全解析中...");
    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "parseWithAI", data: { text: rawText, headers: currentTableHeaders } })
      });
      const resJson = await response.json();
      if (resJson.status !== 'success') throw new Error(resJson.message);
      fillTableWithData(resJson.data);
      document.getElementById('aiStatus').innerText = "✅ 解析完成！";
      document.getElementById('aiRawText').value = ""; 
    } catch (err) { alert("解析失敗：" + err.message); }
    finally { hideLoading(); }
  }

  function fillTableWithData(parsedRows) {
    const tableRows = document.querySelectorAll('#tableBody tr');
    const dateColIdx = currentTableHeaders.indexOf("日期");
    const dateMap = {};
    tableRows.forEach(tr => { const d = tr.querySelectorAll('input')[dateColIdx]?.value.trim(); if(d) dateMap[d] = tr; });
    parsedRows.forEach(rowData => {
      let targetRow = dateMap[rowData["日期"]];
      if (!targetRow) {
        for (let tr of tableRows) { if (tr.querySelectorAll('input')[0].value.trim() === "") { targetRow = tr; break; } }
      }
      if (targetRow) {
        const inputs = targetRow.querySelectorAll('input');
        currentTableHeaders.forEach((header, colIdx) => {
          const val = rowData[header];
          if (val && val !== "") {
            inputs[colIdx].value = val;
            inputs[colIdx].style.backgroundColor = "#fff3cd";
          }
        });
      }
    });
  }

  async function saveData() {
    showLoading("💾 儲存中...");
    try {
      const matrix = [currentTableHeaders];
      document.querySelectorAll('#tableBody tr').forEach(tr => {
        const row = Array.from(tr.querySelectorAll('input')).map(i => i.value);
        if (row.some(v => v.trim() !== "")) matrix.push(row);
      });
      while(matrix.length <= 50) matrix.push(Array(currentTableHeaders.length).fill(""));
      await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "saveSheetData", data: { groupName: activeGroupName, matrix: matrix } })
      });
      alert("✅ 儲存成功！");
      document.querySelectorAll('.grid-input').forEach(i => i.style.backgroundColor = 'transparent');
    } catch (e) { alert("儲存失敗"); }
    finally { hideLoading(); }
  }

// 🌟 修改後的載入清單邏輯 (支援狀態顯示與切換)
  async function loadAdminData() {
    try {
      showLoading("⏳ 載入清單中...");
      const [groups, templates] = await Promise.all([fetchAPI('getGroups'), fetchAPI('getTemplates')]);
      const div = document.getElementById('groupButtons');
      const base = window.location.href.split('?')[0];
      
      // 重新設計列表 UI：加入啟用/停用標籤與按鈕
      div.innerHTML = groups.map(g => {
        const isEnabled = g.status !== "停用"; 
        const badgeClass = isEnabled ? "bg-success" : "bg-secondary";
        const btnClass = isEnabled ? "btn-outline-danger" : "btn-outline-success";
        const btnText = isEnabled ? "設為停用" : "啟用";
        const opacity = isEnabled ? "1" : "0.5"; // 停用的項目視覺上變淡
        
        return `
          <div class="d-flex justify-content-between align-items-center border rounded p-2 mb-2 shadow-sm" style="opacity: ${opacity}; transition: opacity 0.3s;">
            <a href="${base}?id=${g.id}" class="text-decoration-none flex-grow-1 fw-bold fs-5 ${isEnabled ? 'text-primary' : 'text-muted'}" style="pointer-events: ${isEnabled ? 'auto' : 'none'};">
              ➔ ${g.name}
            </a>
            <div class="d-flex align-items-center">
              <span class="badge ${badgeClass} me-3">${g.status}</span>
              <button class="btn btn-sm ${btnClass}" onclick="toggleStatus('${g.id}', '${g.status}')">${btnText}</button>
            </div>
          </div>
        `;
      }).join('');
      
      document.getElementById('templateSelect').innerHTML = '<option value="" disabled selected>選擇模板</option>' + templates.map(t=>`<option value="${t}">${t}</option>`).join('');
    } catch (err) { 
      document.getElementById('groupButtons').innerHTML = '<p class="text-danger">載入失敗</p>'; 
    } finally { 
      hideLoading(); 
    }
  }

  // ✨ 新增：呼叫後端切換狀態的函式
  async function toggleStatus(groupId, currentStatus) {
    showLoading("🔄 更新狀態中...");
    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ 
          action: "toggleGroupStatus", 
          data: { id: groupId, status: currentStatus } 
        })
      });
      const resJson = await response.json();
      if (resJson.status === 'success') {
        // 更新成功後，重新載入列表刷新畫面
        await loadAdminData();
      } else {
        throw new Error(resJson.message);
      }
    } catch (e) {
      alert("狀態更新失敗：" + e.message);
    } finally {
      hideLoading();
    }
  }
  function showSection(id) {
    document.querySelectorAll('.card-custom').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  const createForm = document.getElementById('createGroupForm');
  if (createForm) {
    createForm.onsubmit = async function(e) {
      e.preventDefault(); showLoading("建立中...");
      try {
        await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "createGroup", data: { id: document.getElementById('newId').value, name: document.getElementById('newName').value, template: document.getElementById('templateSelect').value } }) });
        location.reload();
      } catch (e) { alert("失敗"); } finally { hideLoading(); }
    };
  }
</script>
</body>
</html>
