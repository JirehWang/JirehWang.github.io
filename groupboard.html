<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小組近期聚會佈告欄</title>
    <script src="https://LKERP.github.io/config.js?v=3" defer></script>
    <style>
        /* 佈告欄專屬的 CSS 風格 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
            margin: 0;
            padding: 20px;
        }
        .board-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #2b6cb0;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            color: #718096;
            font-size: 1.1em;
        }
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .event-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-top: 5px solid #48bb78; /* 小組用綠色系區分 */
        }
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }
        .date-badge {
            background: #f0fff4;
            color: #2f855a;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .date-badge .day {
            font-size: 2em;
            font-weight: bold;
            line-height: 1;
        }
        .date-badge .ym {
            font-size: 0.9em;
            color: #4a5568;
            margin-top: 5px;
        }
        .card-body {
            padding: 20px;
        }
        .group-tag {
            display: inline-block;
            background: #f0fff4;
            color: #2f855a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .event-name {
            font-size: 1.25em;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
            text-align: center;
        }
        .duty-section {
            background: #f9fafb;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #48bb78;
        }
        .info-row {
            margin-bottom: 6px;
            font-size: 0.95em;
            line-height: 1.4;
            display: flex;
            justify-content: space-between;
        }
        .info-label {
            color: #718096;
            font-weight: bold;
            margin-right: 5px;
        }
        .info-value {
            color: #2d3748;
            font-weight: 500;
        }
        .no-data {
            text-align: center;
            color: #a0aec0;
            font-size: 1.2em;
            padding: 50px;
            grid-column: 1 / -1;
        }
        .admin-link {
            display: block;
            text-align: center;
            margin-top: 40px;
            color: #718096;
            text-decoration: none;
            font-size: 0.9em;
        }
        .admin-link:hover { color: #2b6cb0; text-decoration: underline; }
        
        .spinner {
            margin: 100px auto;
            width: 50px;
            height: 40px;
            text-align: center;
            font-size: 10px;
        }
        .spinner > div {
            background-color: #48bb78;
            height: 100%;
            width: 6px;
            display: inline-block;
            animation: sk-stretchdelay 1.2s infinite ease-in-out;
        }
        @keyframes sk-stretchdelay {
            0%, 40%, 100% { transform: scaleY(0.4); }  
            20% { transform: scaleY(1.0); }
        }
    </style>
</head>
<body>

    <div class="board-container">
        <div class="header">
            <h1>🌿 小組團契近期聚會佈告欄</h1>
            <p id="dateRangeText"> 願你們平安，在小組團契裡常存愛的陪伴❤️❤️❤️<br><small>同步小組最新資料中...</small></p>
        </div>

        <div id="boardGrid" class="event-grid">
            <div class="spinner">
                <div class="rect1"></div><div class="rect2"></div><div class="rect3"></div><div class="rect4"></div><div class="rect5"></div>
            </div>
        </div>

        <a href="index.html" class="admin-link">⚙️ 返回系統管理員介面</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchAndRenderBoard);

        async function fetchAndRenderBoard() {
            const container = document.getElementById('boardGrid');
            const dateRangeText = document.getElementById('dateRangeText');

            try {
                // 🌟 修改點 2：加入耐心等待機制，最多等 3 秒讓 config.js 載入完畢
                let retryCount = 0;
                while (typeof window.churchAPI !== 'function' && retryCount < 30) {
                    await new Promise(resolve => setTimeout(resolve, 100)); // 每次等 0.1 秒
                    retryCount++;
                }

                // 🌟 3. 如果等了 3 秒還是沒有，才拋出錯誤
                if (typeof window.churchAPI !== 'function') {
                    throw new Error("系統安全設定 (config.js) 連線超時，請檢查網路或強制重新整理 (Ctrl+F5)。");
                }

                // 改用中央通訊系統，自動帶入 Token 鑰匙！
                const result = await window.churchAPI('getAggregatedReport', { type: 'smallGroup' });

                if (result.status !== 'success') throw new Error(result.message || "資料抓取失敗");

                // 轉換格式
                const allRawData = matrixToObjects(result.data);

                // 處理日期區間：今天 ~ 今天+7天
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const next7Days = new Date();
                next7Days.setDate(today.getDate() + 7);
                next7Days.setHours(23, 59, 59, 999);

                dateRangeText.innerHTML = `願你們平安，在小組團契裡常存愛的陪伴❤️❤️❤️<br>📅 小組團契聚會預告：${formatDate(today)} ~ ${formatDate(next7Days)}`;

                // 過濾與排序
                const filteredEvents = allRawData.filter(item => {
                    const itemDate = new Date(item["日期"]);
                    return itemDate >= today && itemDate <= next7Days;
                }).sort((a, b) => new Date(a["日期"]) - new Date(b["日期"]));

                if (filteredEvents.length === 0) {
                    container.innerHTML = '<div class="no-data">✨ 近期小組尚無已排定的聚會資訊</div>';
                    return;
                }

                // 渲染
                container.innerHTML = filteredEvents.map(event => {
                    const dateObj = new Date(event["日期"]);
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    const yearMonth = `${dateObj.getFullYear()}年 ${dateObj.getMonth() + 1}月`;
                    const weekDay = ['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()];

                    // 排除欄位
                    const excludeFields = ["日期", "分頁名稱", "模板類型", "聚會名稱", "聚會類別", "地點", "經文", "主題"];
                    
                    // 抓取服事內容
                    const duties = Object.keys(event)
                        .filter(key => !excludeFields.includes(key) && event[key] && event[key] !== "-")
                        .map(key => `
                            <div class="info-row">
                                <span class="info-label">${key}</span>
                                <span class="info-value">${event[key]}</span>
                            </div>
                        `).join('');

                    return `
                        <div class="event-card">
                            <div class="date-badge">
                                <div class="day">${day}</div>
                                <div class="ym">${yearMonth} (星期${weekDay})</div>
                            </div>
                            <div class="card-body">
                                <div class="text-center"><span class="group-tag">${event["分頁名稱"]}</span></div>
                                <div class="event-name">${event["主題"] || event["聚會名稱"] || "小組聚會"}</div>
                                
                                <div class="duty-section">
                                    ${duties || '<div class="text-center text-muted small">一般聚會，無需特別服事</div>'}
                                </div>

                                ${event["地點"] ? `<div class="info-row small mt-2"><span class="info-label">📍 地點:</span> <span>${event["地點"]}</span></div>` : ''}
                                ${event["經文"] ? `<div class="info-row small"><span class="info-label">📖 經文:</span> <span>${event["經文"]}</span></div>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="no-data text-danger">⚠️ 連線失敗：${err.message}</div>`;
            }
        }

        function matrixToObjects(matrix) {
            if (!matrix || matrix.length < 2) return [];
            const headers = matrix[0];
            return matrix.slice(1).map(row => {
                let obj = {};
                headers.forEach((h, i) => obj[h] = row[i]);
                return obj;
            });
        }

        function formatDate(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }
    </script>
</body>
</html>
